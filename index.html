<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPRA Scottish Shore 2026 | v8.2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Lightened overlay (0.65) to let the background image bleed through more clearly */
            --bg-overlay: rgba(10, 11, 14, 0.65); 
            --surface-color: rgba(20, 22, 28, 0.6); 
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --glass-border: rgba(0, 242, 255, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #0a0b0e;
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('background.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Improved Header Hub */
        .dynamic-hub { margin-top: 40px; margin-bottom: 30px; width: 100%; display: flex; justify-content: center; }
        
        .hub-pill {
            background: rgba(10, 11, 14, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 12px 25px;
            border-radius: 15px;
            display: flex; align-items: center; gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .assoc-logo {
            height: 60px; /* Increased size */
            width: auto;
            filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.4));
        }

        .hub-text h1 { 
            font-family: 'Oswald', sans-serif; 
            font-size: 1.1rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            line-height: 1.2;
        }

        /* Navigation Buttons */
        .button-stack { width: 100%; max-width: 450px; padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
        
        .slide-btn {
            background: var(--surface-color);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            padding: 20px 24px;
            border-radius: 12px;
            color: var(--text-main);
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            display: flex; justify-content: space-between; align-items: center;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .slide-btn:active { transform: scale(0.96); background: rgba(0, 242, 255, 0.2); }
        
        .alt-btn { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.1); }

        .divider { height: 1px; background: rgba(255,255,255,0.2); margin: 10px 0; width: 100%; }

        .footer { margin-top: auto; padding: 40px; font-size: 0.7rem; color: rgba(255,255,255,0.6); text-align: center; text-transform: uppercase; font-weight: bold; }
        .version-tag { color: var(--accent-cyan); }
    </style>
</head>
<body>

    <header class="dynamic-hub">
        <div class="hub-pill">
            <img src="logo.png" alt="SPRA Logo" class="assoc-logo">
            <div class="hub-text">
                <h1>SPRA Scottish<br>Shore 2026</h1>
            </div>
        </div>
    </header>

    <nav class="button-stack">
        <a href="individual.pdf" class="slide-btn">
            <span>Individual Winner</span>
            <span style="color: var(--accent-cyan)">VIEW ❯</span>
        </a>
        <a href="team.pdf" class="slide-btn">
            <span>Team Winners</span>
            <span style="color: var(--accent-cyan)">VIEW ❯</span>
        </a>
        <a href="zone1.pdf" class="slide-btn">
            <span>Zone Day 1</span>
            <span style="color: var(--accent-cyan)">VIEW ❯</span>
        </a>
        <a href="zone2.pdf" class="slide-btn">
            <span>Zone Day 2</span>
            <span style="color: var(--accent-cyan)">VIEW ❯</span>
        </a>
        <a href="biggest.pdf" class="slide-btn">
            <span>Biggest Fish</span>
            <span style="color: var(--accent-cyan)">VIEW ❯</span>
        </a>

        <div class="divider"></div>

        <a href="totals.pdf" class="slide-btn alt-btn">
            <span>Overall Totals</span>
            <span>DATA ❯</span>
        </a>
        <a href="performance.pdf" class="slide-btn alt-btn">
            <span>Performance Stats</span>
            <span>DATA ❯</span>
        </a>
    </nav>

    <footer class="footer">
        Official Results Portal<br>
        v8.2.0 | <span class="version-tag">LIVE SYNC</span>
    </footer>

    <script>
        // Forces the browser to refresh the PDF from GitHub instead of using an old cached version
        document.querySelectorAll('.slide-btn').forEach(button => {
            button.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && href.includes('.pdf')) {
                    e.preventDefault();
                    const timestamp = new Date().getTime();
                    window.location.href = href + "?v=" + timestamp;
                }
            });
        });
    </script>
</body>
</html>
