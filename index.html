<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPRA Scottish Shore 2026 | v7.8.2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0b0e;
            --surface-color: rgba(20, 22, 28, 0.98);
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --glass-border: rgba(0, 242, 255, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            background: radial-gradient(circle at center, #1a1f26 0%, #0a0b0e 100%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* Header Pill */
        .dynamic-hub { margin-top: 50px; margin-bottom: 40px; }
        .hub-pill {
            background: var(--surface-color);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 12px 30px;
            border-radius: 50px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        .hub-status { width: 8px; height: 8px; background: var(--accent-cyan); border-radius: 50%; box-shadow: 0 0 10px var(--accent-cyan); animation: pulse 2s infinite; }
        h1 { font-family: 'Oswald', sans-serif; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; }

        /* Smooth Buttons */
        .button-stack { width: 100%; max-width: 450px; padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
        .slide-btn {
            background: var(--surface-color);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 14px;
            color: var(--text-main);
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            display: flex; justify-content: space-between; align-items: center;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), border 0.2s;
        }
        .slide-btn:active { transform: scale(0.97); }

        /* The Smooth Viewer */
        #viewer-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: none; flex-direction: column; z-index: 1000;
            will-change: transform; /* Hardware Acceleration */
        }

        .viewer-header { 
            padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--glass-border);
            background: #000;
        }

        .close-btn { 
            background: var(--accent-cyan); color: #000; border: none; 
            padding: 10px 25px; border-radius: 30px; font-weight: bold; 
            cursor: pointer; font-family: 'Oswald', sans-serif; 
        }

        .pdf-scroll-container {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* Momentum Scrolling */
            display: flex; flex-direction: column;
            gap: 10px; padding: 10px;
            background: #111;
        }

        .pdf-frame {
            width: 100%; height: 85vh;
            border: none; background: #fff;
            border-radius: 4px;
            flex-shrink: 0; /* Prevents frame collapsing */
        }

        .footer { margin-top: auto; padding: 40px; font-size: 0.7rem; color: #444; text-align: center; }
        .version-tag { color: var(--accent-cyan); font-weight: 700; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <header class="dynamic-hub">
        <div class="hub-pill">
            <div class="hub-status"></div>
            <h1>SPRA Scottish Shore 2026</h1>
        </div>
    </header>

    <nav class="button-stack">
        <div class="slide-btn" onclick="openResult(['individual.pdf'], 'Individual Result')">
            <span>Individual Winner</span>
            <span style="color: var(--accent-cyan)">LIVE ❯</span>
        </div>
        <div class="slide-btn" onclick="openResult(['team.pdf'], 'Team Result')">
            <span>Team Winners</span>
            <span style="color: var(--accent-cyan)">LIVE ❯</span>
        </div>
        <div class="slide-btn" onclick="openResult(['zone1.pdf'], 'Zone Day 1')">
            <span>Zone Day 1</span>
            <span style="color: var(--accent-cyan)">LIVE ❯</span>
        </div>
        <div class="slide-btn" onclick="openResult(['zone2.pdf'], 'Zone Day 2')">
            <span>Zone Day 2</span>
            <span style="color: var(--accent-cyan)">LIVE ❯</span>
        </div>
        <div class="slide-btn" onclick="openResult(['biggest.pdf'], 'Biggest Fish')">
            <span>Biggest Fish</span>
            <span style="color: var(--accent-cyan)">LIVE ❯</span>
        </div>
        <div class="slide-btn" style="border-color: #fff" onclick="openResult(['totals.pdf', 'performance.pdf'], 'Performance Charts')">
            <span>Performance Charts</span>
            <span style="color: #fff">VIEW ALL ❯</span>
        </div>
    </nav>

    <div id="viewer-modal">
        <div class="viewer-header">
            <span id="viewer-title" style="font-family: 'Oswald'; color: var(--accent-cyan); text-transform: uppercase;"></span>
            <button class="close-btn" onclick="closeViewer()">CLOSE</button>
        </div>
        <div id="pdf-container" class="pdf-scroll-container"></div>
    </div>

    <footer class="footer">
        SSOT VERSION: <span class="version-tag">v7.8.2</span>
    </footer>

    <script>
        const modal = document.getElementById('viewer-modal');
        const container = document.getElementById('pdf-container');
        const titleElement = document.getElementById('viewer-title');

        // This determines the live URL of your site automatically
        const SITE_URL = window.location.origin + window.location.pathname;

        function openResult(files, title) {
            const timestamp = new Date().getTime();
            container.innerHTML = ''; 
            
            files.forEach(file => {
                const iframe = document.createElement('iframe');
                
                // Get absolute path
                const fullPdfPath = new URL(file, SITE_URL).href + "?v=" + timestamp;
                
                // GView is the "Secret Sauce" for mobile smoothing
                iframe.src = `https://docs.google.com/gview?url=${encodeURIComponent(fullPdfPath)}&embedded=true`;
                
                iframe.className = 'pdf-frame';
                container.appendChild(iframe);
            });

            titleElement.innerText = title;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeViewer() {
            modal.style.display = 'none';
            container.innerHTML = '';
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
