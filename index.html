<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishing Competition Results | v7.4.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0b0e;
            --surface-color: rgba(25, 28, 35, 0.8);
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --glass-border: rgba(0, 242, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background: radial-gradient(circle at center, #1a1f26 0%, #0a0b0e 100%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Movement Background Texture */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.1;
            z-index: -1;
            pointer-events: none;
        }

        /* Dynamic Hub Header */
        .dynamic-hub {
            margin-top: 40px;
            margin-bottom: 50px;
            z-index: 100;
        }

        .hub-pill {
            background: var(--surface-color);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 12px 30px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.15);
        }

        .hub-status {
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-cyan);
            animation: pulse 2s infinite;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        /* Main Navigation Stack */
        .button-stack {
            width: 100%;
            max-width: 450px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Sliding Button Design */
        .slide-btn {
            position: relative;
            background: var(--surface-color);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        /* The "Slide" Overlay */
        .slide-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 255, 0.1), transparent);
            transition: all 0.6s ease;
        }

        .slide-btn:hover {
            border-color: var(--accent-cyan);
            transform: translateX(10px);
            box-shadow: -5px 5px 20px rgba(0, 242, 255, 0.1);
            background: rgba(30, 35, 45, 0.9);
        }

        .slide-btn:hover::before {
            left: 100%;
        }

        .btn-icon {
            color: var(--accent-cyan);
            font-size: 0.8rem;
            opacity: 0.6;
            transition: transform 0.3s ease;
        }

        .slide-btn:hover .btn-icon {
            transform: translateX(5px);
            opacity: 1;
        }

        /* SSoT Versioning Footer */
        .footer {
            margin-top: auto;
            padding: 40px;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .version-tag {
            color: var(--accent-cyan);
            font-weight: 700;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 480px) {
            .slide-btn { padding: 18px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header class="dynamic-hub">
        <div class="hub-pill">
            <div class="hub-status"></div>
            <h1>John McCreadie Memorial Trophy</h1>
        </div>
    </header>

    <nav class="button-stack">
        <a href="Season 4.pdf" class="slide-btn">
            <span>Season 4 Results</span>
            <span class="btn-icon">PDF ❯</span>
        </a>

        <a href="Season 3.pdf" class="slide-btn">
            <span>Season 3 Results</span>
            <span class="btn-icon">PDF ❯</span>
        </a>

        <a href="Season 2.pdf" class="slide-btn">
            <span>Season 2 Results</span>
            <span class="btn-icon">PDF ❯</span>
        </a>

        <a href="Season 1.pdf" class="slide-btn">
            <span>Season 1 Results</span>
            <span class="btn-icon">PDF ❯</span>
        </a>

        <a href="latest-weigh-in.pdf" class="slide-btn" style="border-width: 2px;">
            <span>Latest Weigh In Results</span>
            <span class="btn-icon">LIVE ❯</span>
        </a>
    </nav>

    <footer class="footer">
        APP VERSION: <span class="version-tag">v7.4.0</span><br>
        SINGLE SOURCE OF TRUTH DESIGN
    </footer>

    <script>
        const APP_VERSION = "7.4.0";
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('ShoreScore Engine Active: ' + APP_VERSION))
                    .catch(err => console.log('SW Registration Failed', err));
            });
        }
    </script>
</body>
</html>
