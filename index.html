<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPRA Scottish Shore 2026 | v7.4.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0b0e;
            --surface-color: rgba(25, 28, 35, 0.85);
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --glass-border: rgba(0, 242, 255, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background: radial-gradient(circle at center, #1a1f26 0%, #0a0b0e 100%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Subtle Carbon Texture */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.1;
            z-index: -1;
            pointer-events: none;
        }

        /* SPRA Dynamic Hub */
        .dynamic-hub {
            margin-top: 50px;
            margin-bottom: 40px;
            z-index: 100;
        }

        .hub-pill {
            background: var(--surface-color);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 12px 30px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.1);
        }

        .hub-status {
            width: 8px; height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-cyan);
            animation: pulse 2s infinite;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Navigation Stack */
        .button-stack {
            width: 100%;
            max-width: 450px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ShoreScore Sliding Button */
        .slide-btn {
            position: relative;
            background: var(--surface-color);
            border: 1px solid var(--glass-border);
            padding: 22px;
            border-radius: 14px;
            color: var(--text-main);
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .slide-btn::before {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 255, 0.1), transparent);
            transition: all 0.5s ease;
        }

        .slide-btn:hover {
            border-color: var(--accent-cyan);
            transform: translateX(8px);
            background: rgba(35, 40, 50, 0.9);
            box-shadow: -5px 5px 20px rgba(0, 0, 0, 0.4);
        }

        .slide-btn:hover::before { left: 100%; }

        .btn-icon {
            color: var(--accent-cyan);
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* Footer & Versioning */
        .footer {
            margin-top: auto;
            padding: 40px;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .version-tag { color: var(--accent-cyan); font-weight: 700; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <header class="dynamic-hub">
        <div class="hub-pill">
            <div class="hub-status"></div>
            <h1>SPRA Scottish Shore 2026</h1>
        </div>
    </header>

    <nav class="button-stack">
        <a href="individual.pdf" class="slide-btn">
            <span>Individual Winner</span>
            <span class="btn-icon">RESULTS ❯</span>
        </a>

        <a href="team.pdf" class="slide-btn">
            <span>Team Winners</span>
            <span class="btn-icon">RESULTS ❯</span>
        </a>

        <a href="zone1.pdf" class="slide-btn">
            <span>Zone Day 1</span>
            <span class="btn-icon">RESULTS ❯</span>
        </a>

        <a href="zone2.pdf" class="slide-btn">
            <span>Zone Day 2</span>
            <span class="btn-icon">RESULTS ❯</span>
        </a>

        <a href="biggest.pdf" class="slide-btn" style="border-color: var(--accent-cyan);">
            <span>Biggest Fish</span>
            <span class="btn-icon">TROPHY ❯</span>
        </a>
    </nav>

    <footer class="footer">
        Single Source of Truth Version: <span class="version-tag">v7.4.0</span>
    </footer>

    <script>
        const VERSION = "7.4.0";
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(() => console.log('SPRA Service Worker Active ' + VERSION));
            });
        }
    </script>
</body>
</html>
