<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPRA Scottish Shore 2026 | v8.2.1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-overlay: rgba(10, 11, 14, 0.65); 
            --surface-color: rgba(20, 22, 28, 0.6); 
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --glass-border: rgba(0, 242, 255, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #0a0b0e;
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('background.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Branding Header */
        .dynamic-hub { margin-top: 40px; margin-bottom: 30px; width: 100%; display: flex; justify-content: center; }
        .hub-pill {
            background: rgba(10, 11, 14, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 12px 25px;
            border-radius: 15px;
            display: flex; align-items: center; gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .assoc-logo { height: 60px; width: auto; filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.4)); }
        .hub-text h1 { font-family: 'Oswald', sans-serif; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; }

        /* Navigation Buttons */
        .button-stack { width: 100%; max-width: 450px; padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
        .slide-btn {
            background: var(--surface-color);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            padding: 20px 24px;
            border-radius: 12px;
            color: var(--text-main);
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s ease;
        }
        .slide-btn:active { transform: scale(0.96); background: rgba(0, 242, 255, 0.2); }
        .alt-btn { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.1); }
        .divider { height: 1px; background: rgba(255,255,255,0.2); margin: 10px 0; width: 100%; }

        /* FULL SCREEN VIEWER OVERLAY */
        #viewer-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: none; flex-direction: column; z-index: 2000;
        }

        .viewer-nav {
            padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: #000;
            border-bottom: 2px solid var(--accent-cyan);
        }

        .back-btn {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .pdf-frame-container { flex: 1; -webkit-overflow-scrolling: touch; overflow-y: scroll; }
        iframe { width: 100%; height: 100%; border: none; }

        .footer { margin-top: auto; padding: 40px; font-size: 0.7rem; color: rgba(255,255,255,0.6); text-align: center; text-transform: uppercase; }
        .version-tag { color: var(--accent-cyan); }
    </style>
</head>
<body>

    <header class="dynamic-hub">
        <div class="hub-pill">
            <img src="logo.png" alt="SPRA Logo" class="assoc-logo">
            <div class="hub-text">
                <h1>SPRA Scottish<br>Shore 2026</h1>
            </div>
        </div>
    </header>

    <nav class="button-stack">
        <div class="slide-btn" onclick="openPDF('individual.pdf', 'Individual Winner')">
            <span>Individual Winner</span>
            <span style="color: var(--accent-cyan)">VIEW ❯</span>
        </div>
        <div class="slide-btn" onclick="openPDF('team.pdf', 'Team Result')">
            <span>Team Winners</span>
            <span style="color: var(--accent-cyan)">VIEW ❯</span>
        </div>
        <div class="slide-btn" onclick="openPDF('zone1.pdf', 'Zone Day 1')">
            <span>Zone Day 1</span>
            <span style="color: var(--accent-cyan)">VIEW ❯</span>
        </div>
        <div class="slide-btn" onclick="openPDF('zone2.pdf', 'Zone Day 2')">
            <span>Zone Day 2</span>
            <span style="color: var(--accent-cyan)">VIEW ❯</span>
        </div>
        <div class="slide-btn" onclick="openPDF('biggest.pdf', 'Biggest Fish')">
            <span>Biggest Fish</span>
            <span style="color: var(--accent-cyan)">VIEW ❯</span>
        </div>

        <div class="divider"></div>

        <div class="slide-btn alt-btn" onclick="openPDF('totals.pdf', 'Overall Totals')">
            <span>Overall Totals</span>
            <span>DATA ❯</span>
        </div>
        <div class="slide-btn alt-btn" onclick="openPDF('performance.pdf', 'Performance Stats')">
            <span>Performance Stats</span>
            <span>DATA ❯</span>
        </div>
    </nav>

    <div id="viewer-overlay">
        <div class="viewer-nav">
            <button class="back-btn" onclick="closePDF()">❮ BACK TO MENU</button>
            <span id="current-title" style="color: var(--accent-cyan); font-family: 'Oswald'; font-size: 0.9rem; text-transform: uppercase;"></span>
        </div>
        <div class="pdf-frame-container">
            <iframe id="pdf-view" src=""></iframe>
        </div>
    </div>

    <footer class="footer">
        Official Results Portal<br>
        v8.2.1 | <span class="version-tag">STABLE</span>
    </footer>

    <script>
        function openPDF(file, title) {
            const overlay = document.getElementById('viewer-overlay');
            const frame = document.getElementById('pdf-view');
            const titleDisplay = document.getElementById('current-title');
            
            const timestamp = new Date().getTime();
            
            // Setting the title and source
            titleDisplay.innerText = title;
            frame.src = file + "?v=" + timestamp;
            
            // Showing the overlay
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Stop the home screen from scrolling
        }

        function closePDF() {
            const overlay = document.getElementById('viewer-overlay');
            const frame = document.getElementById('pdf-view');
            
            overlay.style.display = 'none';
            frame.src = ""; // Clear memory
            document.body.style.overflow = 'auto'; // Re-enable home screen scrolling
        }
    </script>
</body>
</html>
