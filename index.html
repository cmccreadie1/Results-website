<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPRA Scottish Shore 2026 | v1.1.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-overlay: rgba(245, 247, 250, 0.95); 
            --surface-color: rgba(255, 255, 255, 0.85); 
            --accent-cyan: #0066cc;
            --text-main: #1a1e26;
            --glass-border: rgba(0, 102, 204, 0.2);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            background-color: #f0f2f5;
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('background.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }

        /* Branding Header */
        .dynamic-hub { 
            margin-top: 20px; 
            margin-bottom: 15px; 
            width: 100%; 
            display: flex; 
            justify-content: center; 
        }
        .hub-pill {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 15px;
            display: flex; 
            align-items: center; 
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .assoc-logo { 
            height: 50px; 
            width: auto; 
            filter: drop-shadow(0 0 8px rgba(0, 102, 204, 0.2)); 
        }
        .hub-text h1 { 
            font-family: 'Oswald', sans-serif; 
            font-size: 1rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }

        /* Live Status Badge */
        .live-status-badge {
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            margin-bottom: 15px; 
            color: #666;
            font-size: 0.7rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-weight: bold;
        }
        .pulse-dot {
            width: 7px; 
            height: 7px; 
            background-color: var(--accent-cyan); 
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan); 
            animation: flash 2s infinite;
        }

        /* Navigation Menu Stack */
        .button-stack { 
            width: 100%; 
            max-width: 450px; 
            padding: 0 15px; 
            display: flex; 
            flex-direction: row; 
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px; 
        }
        .slide-btn {
            background: var(--surface-color);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 15px 12px;
            border-radius: 10px;
            color: var(--text-main);
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            font-size: 0.95rem;
            text-transform: uppercase;
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            text-align: center;
            transition: all 0.1s ease;
            flex: 0 0 calc(50% - 5px);
            gap: 4px;
        }
        .slide-btn:active { 
            transform: scale(0.96); 
            background: var(--accent-cyan);
            color: #fff;
            border-color: #004c99;
            box-shadow: 0 0 15px rgba(0, 102, 204, 0.4);
        }

        /* Full Screen Native Table Viewer Overlay */
        #viewer-overlay {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #f0f2f5;
            display: none; 
            flex-direction: column; 
            z-index: 2000;
        }
        .viewer-nav {
            padding: 10px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: #fff; 
            border-bottom: 2px solid var(--accent-cyan); 
            flex-shrink: 0; 
            z-index: 20; 
        }
        .back-btn {
            background: var(--accent-cyan); 
            color: #fff; 
            border: none; 
            padding: 8px 12px; 
            border-radius: 8px;
            font-family: 'Oswald', sans-serif; 
            font-weight: 700; 
            cursor: pointer; 
            text-transform: uppercase; 
            font-size: 0.85rem;
            white-space: nowrap;
        }
        #current-title {
            color: var(--accent-cyan); 
            font-family: 'Oswald'; 
            font-size: 0.9rem; 
            text-transform: uppercase;
            flex-grow: 1; 
            text-align: center; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
            margin: 0 10px;
        }
        .search-box {
            background: #fff; 
            border: 1px solid var(--accent-cyan); 
            color: var(--text-main); 
            padding: 8px 12px; 
            border-radius: 20px;
            font-family: 'Inter', sans-serif; 
            font-size: 0.85rem; 
            outline: none; 
            width: 120px; 
            transition: width 0.3s;
        }
        .search-box:focus { 
            width: 160px; 
            box-shadow: 0 0 10px rgba(0, 102, 204, 0.2); 
        }

        /* Scroll Hint Indicator */
        .scroll-hint {
            background: #e4e7eb;
            color: var(--accent-cyan);
            font-family: 'Oswald', sans-serif;
            font-size: 0.75rem;
            text-align: center;
            padding: 6px;
            border-bottom: 1px solid #ccc;
            text-transform: uppercase;
            letter-spacing: 1px;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .hint-icon {
            display: inline-block;
            font-size: 1rem;
            animation: swipeHint 1.5s infinite ease-in-out;
        }
        @keyframes swipeHint {
            0% { transform: translateX(-5px); opacity: 0.5; }
            50% { transform: translateX(8px); opacity: 1; text-shadow: 0 0 10px rgba(0, 102, 204, 0.4); }
            100% { transform: translateX(-5px); opacity: 0.5; }
        }

        .table-scroll-box {
            flex: 1; 
            overflow-x: auto; 
            overflow-y: auto; 
            padding: 0 15px 15px 15px; 
            background: #f0f2f5;
            -webkit-overflow-scrolling: touch;
        }

        /* Ribbon Styles */
        .info-banner {
            background: rgba(0, 102, 204, 0.05); 
            border: 1px solid rgba(0, 102, 204, 0.25); 
            border-radius: 6px;
            padding: 8px 12px; 
            margin: 12px auto 15px auto; 
            max-width: 95%; 
            color: var(--text-main);
            font-family: 'Inter', sans-serif; 
            font-size: 0.75rem; 
            line-height: 1.4; 
            text-align: center;
        }
        .rule-segment { 
            margin-right: 12px; 
            display: inline-block; 
        }

        /* Skeleton Animation */
        .skeleton-wrapper { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            margin-top: 20px; 
        }
        .skeleton-row { 
            height: 40px; 
            background: #e4e7eb; 
            border-radius: 4px; 
            position: relative; 
            overflow: hidden; 
        }
        .skeleton-row::after {
            content: ""; 
            position: absolute; 
            top: 0; 
            right: 0; 
            bottom: 0; 
            left: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 
            0% { transform: translateX(-100%); } 
            100% { transform: translateX(100%); } 
        }

        /* Table Styles */
        table { 
            border-collapse: separate; 
            border-spacing: 0; 
            width: 100%; 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            font-size: 0.9rem; 
            margin-bottom: 30px; 
            white-space: nowrap; 
        }
        table:first-child { margin-top: 15px; }
        
        table th:nth-child(1), table td:nth-child(1) { width: 1%; white-space: nowrap; } 
        table th:nth-child(2), table td:nth-child(2) { width: 1%; white-space: nowrap; } 

        th {
            background: #e4e7eb; 
            color: var(--accent-cyan); 
            font-family: 'Oswald', sans-serif; 
            text-transform: uppercase;
            font-weight: 700; 
            letter-spacing: 1px; 
            padding: 6px 8px; 
            border-bottom: 2px solid var(--accent-cyan);
            position: sticky; 
            top: 0; 
            z-index: 10;
            text-align: center; 
        }
        td { 
            padding: 6px 8px; 
            text-align: center; 
        }
        tr:nth-child(even) td { background: rgba(0, 0, 0, 0.03); }
        tr:nth-child(odd) td { background: rgba(255, 255, 255, 0.5); }

        .zone-red { color: #ff5252; } 
        .zone-yellow { color: #d4a000; } 
        .zone-green { color: #00b35c; } 
        .zone-blue { color: #2979ff; }
        table.zone-red th { border-bottom-color: #ff5252; color: #ff5252; }
        table.zone-yellow th { border-bottom-color: #d4a000; color: #d4a000; }
        table.zone-green th { border-bottom-color: #00b35c; color: #00b35c; }
        table.zone-blue th { border-bottom-color: #2979ff; color: #2979ff; }

        .status-msg { 
            font-family: 'Oswald', sans-serif; 
            color: #ff4444; 
            text-align: center; 
            padding: 40px 20px; 
            text-transform: uppercase; 
            font-size: 1.1rem; 
        }
        
        /* Match Stats Dashboard Styles */
        .stat-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--surface-color);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }
        .stat-title {
            color: var(--accent-cyan);
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .stat-value {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 5px;
        }
        .stat-sub {
            font-size: 0.9rem;
            color: #555c66;
            font-weight: 400;
        }
        .stat-desc {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: #555c66;
        }

        /* CSS Bar Charts */
        .bar-chart-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 6px;
            margin: 8px 0;
            height: 32px;
            position: relative;
            overflow: visible;
            border: 1px solid rgba(0,0,0,0.1);
            z-index: 1;
        }
        .bar-chart-fill {
            height: 100%;
            display: flex;
            align-items: center;
            padding-left: 10px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: width 1s ease-out;
            position: relative;
            z-index: 2;
        }
        .bar-chart-label-right {
            position: absolute;
            right: 10px;
            top: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            color: var(--text-main);
            font-weight: 700;
            z-index: 3;
            background: rgba(255,255,255,0.7);
            padding: 0 4px;
            border-radius: 4px;
        }
        
        .zone-text-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 8px;
            margin-bottom: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .footer { 
            margin-top: auto; 
            padding: 30px; 
            font-size: 0.7rem; 
            color: #666; 
            text-align: center; 
            text-transform: uppercase; 
        }
        @keyframes flash { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.4; } 
        }
    </style>
</head>
<body>

    <header class="dynamic-hub">
        <div class="hub-pill">
            <img src="logo.png" alt="SPRA Logo" class="assoc-logo">
            <div class="hub-text">
                <h1>SPRA Scottish<br>Shore 2026</h1>
            </div>
        </div>
    </header>

    <div class="live-status-badge">
        <div class="pulse-dot"></div>
        <span id="sync-time-text">Data Synced: Checking...</span>
    </div>

    <nav class="button-stack">
        <div class="slide-btn" onclick="loadExcelTab('INDIVIDUAL RESULT', 'Individual Winner')">
            <span>Individual Winner</span>
            <span style="color: var(--accent-cyan); font-size: 0.8rem;">VIEW ❯</span>
        </div>
        <div class="slide-btn" onclick="loadExcelTab('TEAM RESULT', 'Team Result')">
            <span>Team Winners</span>
            <span style="color: var(--accent-cyan); font-size: 0.8rem;">VIEW ❯</span>
        </div>
        <div class="slide-btn" onclick="loadExcelTab('ZONE 1', 'Zone Day 1')">
            <span>Zone Day 1</span>
            <span style="color: var(--accent-cyan); font-size: 0.8rem;">VIEW ❯</span>
        </div>
        <div class="slide-btn" onclick="loadExcelTab('ZONE 2', 'Zone Day 2')">
            <span>Zone Day 2</span>
            <span style="color: var(--accent-cyan); font-size: 0.8rem;">VIEW ❯</span>
        </div>
        <div class="slide-btn" onclick="loadExcelTab('SECRET PAIRS', 'Secret Pairs')">
            <span>Secret Pairs</span>
            <span style="color: var(--accent-cyan); font-size: 0.8rem;">VIEW ❯</span>
        </div>
        <div class="slide-btn" onclick="loadExcelTab('BIGGEST FISH', 'Biggest Fish')">
            <span>Biggest Fish</span>
            <span style="color: var(--accent-cyan); font-size: 0.8rem;">VIEW ❯</span>
        </div>
        
        <div class="slide-btn" onclick="loadMatchStats('Match Stats')" style="flex: 0 0 100%;">
            <span>Match Stats</span>
            <span style="color: var(--accent-cyan); font-size: 0.8rem;">VIEW ❯</span>
        </div>
    </nav>

    <div id="viewer-overlay">
        <div class="viewer-nav">
            <button class="back-btn" onclick="closeViewer()">❮ MENU</button>
            <span id="current-title"></span>
            <input type="text" id="search-box" class="search-box" placeholder="Find Angler..." onkeyup="filterTable()">
        </div>
       <div class="scroll-hint">SWIPE TABLE TO VIEW COLUMNS <span class="hint-icon">➔</span></div>
        <div class="table-scroll-box" id="table-output"></div>
    </div>

    <footer class="footer">
        Official Results Portal | v1.1.0
    </footer>

    <script>
        const TAB_CONFIG = {
            'INDIVIDUAL RESULT': { 
                staticRules: ["<strong>RANKING:</strong> Lowest Zone Points &nbsp;|&nbsp; <strong>TIES:</strong> Cumulative Length ➔ Total Fish Count ➔ Biggest Fish"]
            }, 
            'ZONE 1': { 
                staticRules: ["<strong>RANKING:</strong> Lowest Zone Points &nbsp;|&nbsp; <strong>TIES:</strong> Session Length ➔ Fish Count"]
            },                 
            'ZONE 2': { 
                staticRules: ["<strong>RANKING:</strong> Lowest Zone Points &nbsp;|&nbsp; <strong>TIES:</strong> Session Length ➔ Fish Count"]
            }                  
        };

        let cachedScores = null;

        document.addEventListener("DOMContentLoaded", updateSyncTime);

        async function updateSyncTime() {
            try {
                const timestampForFetch = new Date().getTime();
                const response = await fetch('scores.json?v=' + timestampForFetch, { method: 'HEAD' });
                
                if (response.ok === true) {
                    const lastMod = response.headers.get('Last-Modified');
                    if (lastMod !== null) {
                        const dateObj = new Date(lastMod);
                        const displayDate = dateObj.toLocaleDateString();
                        const displayTime = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                        document.getElementById('sync-time-text').innerText = 'Data Synced: ' + displayDate + ', ' + displayTime;
                        return;
                    }
                }
                document.getElementById('sync-time-text').innerText = 'Data Synced: Live Ready';
            } catch (error) { 
                document.getElementById('sync-time-text').innerText = 'Data Synced: Offline (Cached Version)'; 
            }
        }

        async function fetchScores() {
            if (cachedScores !== null) {
                return cachedScores;
            }
            const timestampForFetch = new Date().getTime();
            const response = await fetch('scores.json?v=' + timestampForFetch);
            if (response.ok === false) {
                throw new Error("Scores JSON file not found.");
            }
            cachedScores = await response.json();
            return cachedScores;
        }

        function filterTable() {
            const inputField = document.getElementById('search-box');
            const filterValue = inputField.value.toUpperCase();
            const tables = document.querySelectorAll('#table-output table');
            
            tables.forEach(function(table) {
                const tableRows = table.getElementsByTagName('tr');
                for (let i = 1; i < tableRows.length; i++) {
                    const rowText = tableRows[i].innerText.toUpperCase();
                    if (rowText.includes(filterValue) === true) {
                        tableRows[i].style.display = "";
                    } else {
                        tableRows[i].style.display = "none";
                    }
                }
            });
        }

        // MATCH STATS DASHBOARD (COMPLETELY DYNAMIC ENGINE)
        async function loadMatchStats(displayTitle) {
            const overlay = document.getElementById('viewer-overlay');
            const output = document.getElementById('table-output');
            const titleDisplay = document.getElementById('current-title');
            
            document.getElementById('search-box').style.display = 'none';
            document.querySelector('.scroll-hint').style.display = 'none';
            document.getElementById('search-box').value = '';
            titleDisplay.innerText = displayTitle;
            
            output.innerHTML = `
                <div class="skeleton-wrapper">
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                </div>
            `;
            
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';

            await new Promise(resolve => setTimeout(resolve, 400));

            try {
                const anglers = await fetchScores();
                
                // Initialize math trackers
                let totalAnglers = anglers.length;
                let totalFish = 0;
                let day1Fish = 0;
                let day2Fish = 0;
                let totalLengthCm = 0;
                let day1LengthTotal = 0;
                let day2LengthTotal = 0;
                let blankers = 0;
                let soloCount = 0;
                let teamsSet = new Set();
                
                // Track dynamic macro lunkers across variables
                let day1LunkerZone = "None";
                let day1LunkerSize = 0;
                let day2LunkerZone = "None";
                let day2LunkerSize = 0;

                let zoneKeys = ['Red Zone', 'Blue Zone', 'Green Zone', 'Yellow Zone'];
                let d1ZoneTotals = {}, d2ZoneTotals = {};
                zoneKeys.forEach(k => {
                    d1ZoneTotals[k] = { fish: 0, length: 0, anglers: 0, maxFish: 0, totalCompetitors: 0 };
                    d2ZoneTotals[k] = { fish: 0, length: 0, anglers: 0, maxFish: 0, totalCompetitors: 0 };
                });

                anglers.forEach(item => {
                    let cFish = item.totals.cumulativeFish || 0;
                    let cLen = item.totals.cumulativeLengthCm || 0;
                    let teamRaw = String(item.teamName || "").trim();
                    
                    totalFish += cFish;
                    totalLengthCm += cLen;
                    if (cFish === 0) blankers++;
                    
                    if (teamRaw === "" || teamRaw.toUpperCase() === "SOLO") {
                        soloCount++;
                    } else {
                        teamsSet.add(teamRaw);
                    }

                    // Parse Day 1 Sub-Objects
                    if (item.day1 && item.day1.zone) {
                        let z = item.day1.zone;
                        day1Fish += item.day1.fishCount || 0;
                        day1LengthTotal += item.day1.totalLengthCm || 0;
                        if (d1ZoneTotals[z]) {
                            d1ZoneTotals[z].totalCompetitors++;
                            if (item.day1.fishCount > 0) {
                                d1ZoneTotals[z].fish += item.day1.fishCount;
                                d1ZoneTotals[z].length += item.day1.totalLengthCm;
                                d1ZoneTotals[z].anglers++;
                                if (item.day1.fishCount > d1ZoneTotals[z].maxFish) d1ZoneTotals[z].maxFish = item.day1.fishCount;
                            }
                        }
                        if (item.day1.biggestFishCm > day1LunkerSize) {
                            day1LunkerSize = item.day1.biggestFishCm;
                            day1LunkerZone = z;
                        }
                    }

                    // Parse Day 2 Sub-Objects
                    if (item.day2 && item.day2.zone) {
                        let z = item.day2.zone;
                        day2Fish += item.day2.fishCount || 0;
                        day2LengthTotal += item.day2.totalLengthCm || 0;
                        if (d2ZoneTotals[z]) {
                            d2ZoneTotals[z].totalCompetitors++;
                            if (item.day2.fishCount > 0) {
                                d2ZoneTotals[z].fish += item.day2.fishCount;
                                d2ZoneTotals[z].length += item.day2.totalLengthCm;
                                d2ZoneTotals[z].anglers++;
                                if (item.day2.fishCount > d2ZoneTotals[z].maxFish) d2ZoneTotals[z].maxFish = item.day2.fishCount;
                            }
                        }
                        if (item.day2.biggestFishCm > day2LunkerSize) {
                            day2LunkerSize = item.day2.biggestFishCm;
                            day2LunkerZone = z;
                        }
                    }
                });

                let scoringAnglersCount = totalAnglers - blankers;
                let successRate = totalAnglers > 0 ? ((scoringAnglersCount / totalAnglers) * 100).toFixed(0) : 0;
                let competitorAverage = scoringAnglersCount > 0 ? (totalFish / scoringAnglersCount) : 0;
                let totalMeters = (totalLengthCm / 100).toFixed(2);
                let avgFishLength = totalFish > 0 ? (totalLengthCm / totalFish).toFixed(1) : 0;
                
                let shiftFish = day2Fish - day1Fish;
                let shiftFishText = shiftFish > 0 ? `The field caught ${shiftFish} more fish on Day 2.` : (shiftFish < 0 ? `The field caught ${Math.abs(shiftFish)} fewer fish on Day 2.` : "The field caught the exact same amount of fish on Day 2.");
                let shiftLen = (day2LengthTotal - day1LengthTotal) / 100;
                let shiftLenText = shiftLen > 0 ? `The field recorded ${shiftLen.toFixed(2)} more meters of fish on Day 2.` : (shiftLen < 0 ? `The field recorded ${Math.abs(shiftLen).toFixed(2)} fewer meters of fish on Day 2.` : "The field recorded exactly the same meters of fish on Day 2.");

                let d1MaxZoneFish = Math.max(...zoneKeys.map(k => d1ZoneTotals[k].fish));
                let d2MaxZoneFish = Math.max(...zoneKeys.map(k => d2ZoneTotals[k].fish));

                let htmlMarkup = '<div class="stat-grid">';
                
                // THE FIELD CARD
                htmlMarkup += '<div class="stat-card" style="border-color: var(--accent-cyan); background: rgba(0, 102, 204, 0.05);">';
                htmlMarkup += '<div class="stat-title">The Field</div>';

        // UNIFIED NAVIGATION COMPONENT
        async function loadExcelTab(targetTabName, displayTitle) {
            const overlay = document.getElementById('viewer-overlay');
            const output = document.getElementById('table-output');
            const titleDisplay = document.getElementById('current-title');
            
            document.getElementById('search-box').style.display = 'block';
            document.querySelector('.scroll-hint').style.display = 'flex';
            document.getElementById('search-box').value = '';
            titleDisplay.innerText = displayTitle;
            
            output.innerHTML = `
                <div class="skeleton-wrapper">
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                </div>
            `;
            
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';

            await new Promise(resolve => setTimeout(resolve, 400));

            try {
                const anglers = await fetchScores();
                let htmlMarkup = '';

                if (TAB_CONFIG[targetTabName] && TAB_CONFIG[targetTabName].staticRules) {
                    htmlMarkup += '<div class="info-banner">';
                    TAB_CONFIG[targetTabName].staticRules.forEach(r => {
                        htmlMarkup += '<span class="rule-segment">' + r + '</span>';
                    });
                    htmlMarkup += '</div>';
                }

                if (targetTabName === 'INDIVIDUAL RESULT') {
                    let sorted = [...anglers].sort((a, b) => (a.totals.overallRank || 999) - (b.totals.overallRank || 999));
                    htmlMarkup += '<div class="table-layout-standard"><table>';
                    htmlMarkup += '<tr><th>RANK</th><th>PTS</th><th>ANGLER NAME</th><th>TEAM</th><th>TIE BREAKERS</th></tr>';
                    sorted.forEach(item => {
                        let teamDisp = (item.teamName === "Solo" || !item.teamName) ? "" : item.teamName;
                        let maxBig = Math.max(item.day1?.biggestFishCm || 0, item.day2?.biggestFishCm || 0);
                        let ties = `${item.totals.cumulativeLengthCm}cm | ${item.totals.cumulativeFish} fish | Max: ${maxBig}cm`;
                        htmlMarkup += `<tr><td>${item.totals.overallRank}</td><td>${item.totals.cumulativePoints}</td><td style="text-align:left; font-weight:bold;">${item.anglerName}</td><td>${teamDisp}</td><td>${ties}</td></tr>`;
                    });
                    htmlMarkup += '</table></div>';
                } 
                else if (targetTabName === 'TEAM RESULT') {
                    let teams = {};
                    anglers.forEach(item => {
                        let t = item.teamName ? item.teamName.trim() : "";
                        if (t === "" || t.toUpperCase() === "SOLO" || t.toUpperCase() === "INDEPENDENT") return;
                        if (!teams[t]) teams[t] = { name: t, pts: 0, len: 0, fish: 0, count: 0 };
                        teams[t].pts += item.totals.cumulativePoints || 0;
                        teams[t].len += item.totals.cumulativeLengthCm || 0;
                        teams[t].fish += item.totals.cumulativeFish || 0;
                        teams[t].count++;
                    });
                    let teamArray = Object.values(teams).sort((a, b) => {
                        if (a.pts !== b.pts) return a.pts - b.pts;
                        return b.len - a.len;
                    });
                    htmlMarkup += '<div class="table-layout-standard"><table>';
                    htmlMarkup += '<tr><th>RANK</th><th>TEAM NAME</th><th>MEMBERS</th><th>TOTAL PTS</th><th>TOTAL LENGTH</th></tr>';
                    teamArray.forEach((team, idx) => {
                        htmlMarkup += `<tr><td>${idx + 1}</td><td style="text-align:left; font-weight:bold;">${team.name}</td><td>${team.count}</td><td>${team.pts}</td><td>${(team.len / 100).toFixed(2)}m</td></tr>`;
                    });
                    htmlMarkup += '</table></div>';
                }
                else if (targetTabName === 'ZONE 1' || targetTabName === 'ZONE 2') {
                    const isDay1 = targetTabName === 'ZONE 1';
                    const zoneBlocks = [
                        { name: 'Red Zone', colorClass: 'zone-red' },       
                        { name: 'Yellow Zone', colorClass: 'zone-yellow' }, 
                        { name: 'Green Zone', colorClass: 'zone-green' }, 
                        { name: 'Blue Zone', colorClass: 'zone-blue' }    
                    ];
                    
                    zoneBlocks.forEach(block => {
                        let zoneAnglers = anglers.filter(item => {
                            let dayData = isDay1 ? item.day1 : item.day2;
                            return dayData && dayData.zone === block.name;
                        }).sort((a, b) => {
                            let dayA = isDay1 ? a.day1 : a.day2;
                            let dayB = isDay1 ? b.day1 : b.day2;
                            if (dayA.zonePoints !== dayB.zonePoints) return dayA.zonePoints - dayB.zonePoints;
                            return dayB.totalLengthCm - dayA.totalLengthCm;

                        if (zoneAnglers.length > 0) {
                            htmlMarkup += `<h3 class="${block.colorClass}" style="margin: 25px 0 10px; font-family: 'Oswald'; text-transform: uppercase;">${block.name}</h3>`;
                            htmlMarkup += `<table class="${block.colorClass}">`;
                            htmlMarkup += '<tr><th>PTS</th><th>PEG</th><th>ANGLER NAME</th><th>TEAM</th><th>TIE BREAKERS</th></tr>';
                            zoneAnglers.forEach(item => {
                                let dayData = isDay1 ? item.day1 : item.day2;
                                let teamDisp = (item.teamName === "Solo" || !item.teamName) ? "" : item.teamName;

                                htmlMarkup += `<tr><td>${dayData.zonePoints}</td><td>${dayData.peg || '-'}</td><td style="text-align:left; font-weight:bold;">${item.anglerName}</td><td>${teamDisp}</td><td>${ties}</td></tr>`;

                        htmlMarkup += `<tr><td>${idx + 1}</td><td style="text-align:left; font-weight:bold;">${fish.name}</td><td>${teamDisp}</td><td>${fish.details}</td><td style="color:var(--accent-cyan); font-weight:bold;">${fish.size} cm</td></tr>`;
                    });
                    htmlMarkup += '</table></div>';
                }
                else if (targetTabName === 'SECRET PAIRS') {
                    let hasPairsData = anglers.some(item => item.pairId || item.secretPairPartner);
                    if (!hasPairsData) {
                        htmlMarkup += '<div class="status-msg" style="color: var(--text-main); font-family: \'Inter\'; font-size: 0.95rem; text-transform: none; padding: 40px; line-height: 1.6;">';
                        htmlMarkup += '<strong>Secret Pairs Section Active</strong><br>';
                        htmlMarkup += 'To output dynamic pairs standings, map a <code>"pairId"</code> or <code>"secretPairPartner"</code> into your input app configuration.</div>';
                    } else {
                        let pairs = {};
                        anglers.forEach(item => {
                            let pId = item.pairId || item.secretPairPartner || "Unassigned";
                            if (!pairs[pId]) pairs[pId] = { id: pId, anglers: [], totalPts: 0, totalLen: 0 };
                            pairs[pId].anglers.push(item);
                            pairs[pId].totalPts += item.totals.cumulativePoints || 0;
                            pairs[pId].totalLen += item.totals.cumulativeLengthCm || 0;
                        });
                        let pairsArray = Object.values(pairs).sort((a,b) => {
                            if(a.totalPts !== b.totalPts) return a.totalPts - b.totalPts;
                            return b.totalLen - a.totalLen;
                        });
                        htmlMarkup += '<div class="table-layout-standard"><table>';
                        htmlMarkup += '<tr><th>RANK</th><th>PAIR MEMBERS</th><th>COMBINED PTS</th><th>COMBINED LENGTH</th></tr>';
                        pairsArray.forEach((p, idx) => {
                            let names = p.anglers.map(a => a.anglerName).join(' & ');
                            htmlMarkup += `<tr><td>${idx + 1}</td><td style="text-align:left; font-weight:bold;">${names}</td><td>${p.totalPts}</td><td>${(p.totalLen/100).toFixed(2)}m</td></tr>`;
                        });
                        htmlMarkup += '</table></div>';
                    }
                }

                output.innerHTML = htmlMarkup;

            } catch (error) {
                console.error(error);
                output.innerHTML = '<div class="status-msg">No Data Active<br><span style="font-size:0.8rem; color:#666;">Check system network configuration or JSON parsing outputs.</span></div>';
            }
        }

        function closeViewer() {
            document.getElementById('viewer-overlay').style.display = 'none';
            document.getElementById('table-output').innerHTML = '';
            document.getElementById('search-box').value = '';
            document.body.style.overflow = 'auto';
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('v1.1.0 registered'))
                    .catch(err => console.error('SW connection failed', err));
            });
        }
    </script>
</body>
</html>
