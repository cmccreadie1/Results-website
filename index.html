<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- 🏆 MATCH CONTROL DECK: PRE-POPULATE LOCAL EVENT DETAILS HERE -->
    <script>
        const MATCH_CONFIG = {
            competitionName: "SPRA Scottish Shore Championship",
            venue:           "Elliot Beach Lunan Bay",
            dates:           "18th & 19th September"
        };
    </script>
    
    <title>Results Portal | Loading...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #f8f9fa;
            --surface-color: #ffffff;
            --accent-cyan: #0066cc;
            --text-main: #111111;
            --text-muted: #555555;
            --border-color: #e4e7eb;
            --red-zone: #ff5252;
            --blue-zone: #2979ff;
            --green-zone: #00b35c;
            --yellow-zone: #d4a000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding-bottom: 20px;
        }

        /* Minimalist Sports-Tech Typographic Header */
        #app-header {
            margin-top: 35px; margin-bottom: 25px; text-align: center;
            width: 100%; max-width: 450px; padding: 0 15px;
        }
        #app-header h1 {
            font-family: 'Oswald', sans-serif; font-size: 1.6rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 3px; line-height: 1.1; color: var(--text-main);
        }
        .header-divider { width: 85%; height: 1px; background-color: var(--border-color); margin: 10px auto 8px auto; }
        #app-header .subtitle-line {
            font-family: 'Inter', sans-serif; font-size: 0.72rem; font-weight: 600;
            color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px;
            line-height: 1.4; display: block;
        }

        /* Monochromatic Premium Grid Menu */
        .button-stack { 
            width: 100%; max-width: 450px; padding: 0 15px; 
            display: flex; flex-direction: row; flex-wrap: wrap; justify-content: space-between;
            gap: 10px; margin-bottom: 30px;
        }
        .slide-btn {
            background: var(--surface-color); border: 1px solid var(--border-color);
            padding: 16px 12px; border-radius: 6px; color: var(--text-main);
            cursor: pointer; font-family: 'Oswald', sans-serif; font-size: 0.9rem;
            text-transform: uppercase; letter-spacing: 1px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            flex: 0 0 calc(50% - 5px); gap: 2px;
        }
        .slide-btn span:last-child {
            font-family: 'Inter', sans-serif; font-size: 0.7rem; font-weight: 700;
            color: var(--accent-cyan); letter-spacing: 0.5px; margin-top: 2px;
        }
        .slide-btn:active { transform: scale(0.97); background: var(--text-main); color: var(--surface-color); }
        .slide-btn:active span:last-child { color: var(--surface-color); }

        /* Full Screen Native Overlay */
        #viewer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg-main); display: none; flex-direction: column; z-index: 2000;
        }
        .viewer-nav {
            padding: 12px 15px; display: flex; justify-content: space-between; align-items: center;
            background: var(--surface-color); border-bottom: 1px solid var(--border-color); 
            flex-shrink: 0; z-index: 20; 
        }
        .back-btn {
            background: var(--text-main); color: var(--surface-color); border: none; 
            padding: 8px 14px; border-radius: 4px; font-family: 'Oswald', sans-serif; 
            font-weight: 500; cursor: pointer; text-transform: uppercase; font-size: 0.8rem;
        }
        #current-title {
            color: var(--text-main); font-family: 'Oswald'; font-size: 0.95rem; 
            text-transform: uppercase; letter-spacing: 1px; flex-grow: 1; text-align: center;
        }
        .search-box {
            background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); 
            padding: 8px 12px; border-radius: 4px; font-family: 'Inter', sans-serif; font-size: 0.8rem;
            width: 110px;
        }
        .table-scroll-box {
            flex: 1; overflow-x: auto; overflow-y: auto; padding: 15px; background: var(--bg-main);
        }

        /* Matrix Card Styles */
        .matrix-container { display: flex; gap: 6px; flex-wrap: wrap; }
        .matrix-card {
            background: #2b3035; color: #fff; padding: 8px; border-radius: 4px;
            font-family: 'Inter', sans-serif; font-size: 0.7rem; flex: 0 0 110px;
        }
        .matrix-card div:first-child { font-weight: 700; color: #fff; }
        .matrix-card div:last-child { color: #aaa; margin-top: 2px; }

        /* General UI */
        table { border-collapse: separate; border-spacing: 0; width: 100%; font-family: 'Inter', sans-serif; font-size: 0.8rem; }
        th { background: #e4e7eb; padding: 8px; text-transform: uppercase; font-weight: 700; }
        td { padding: 10px 8px; border-bottom: 1px solid var(--border-color); }
        .footer {
            margin-top: auto; padding: 25px 15px; text-align: center;
            width: 100%; max-width: 450px; font-size: 0.75rem; color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header id="app-header">
        <h1 id="meta-title-inject">Results Portal</h1>
        <div class="header-divider"></div>
        <div id="meta-venue-inject" class="subtitle-line"></div>
        <div id="meta-dates-inject" class="subtitle-line"></div>
    </header>

    <nav class="button-stack">
        <div class="slide-btn" onclick="loadExcelTab('INDIVIDUAL RESULT', 'Individual Winner')"><span>Individual Winner</span><span>VIEW ❯</span></div>
        <div class="slide-btn" onclick="loadExcelTab('TEAM RESULT', 'Team Result')"><span>Team Winners</span><span>VIEW ❯</span></div>
        <div class="slide-btn" onclick="loadExcelTab('ZONE 1', 'Zone Day 1')"><span>Zone Day 1</span><span>VIEW ❯</span></div>
        <div class="slide-btn" onclick="loadExcelTab('ZONE 2', 'Zone Day 2')"><span>Zone Day 2</span><span>VIEW ❯</span></div>
        <div class="slide-btn" onclick="loadExcelTab('SECRET PAIRS', 'Secret Pairs')"><span>Secret Pairs</span><span>VIEW ❯</span></div>
        <div class="slide-btn" onclick="loadExcelTab('BIGGEST FISH', 'Biggest Fish')"><span>Biggest Fish</span><span>VIEW ❯</span></div>
        <div class="slide-btn" onclick="loadMatchStats('Match Stats')" style="flex: 0 0 100%;"><span>Match Stats Dashboard</span><span>VIEW ANALYTICS ❯</span></div>
    </nav>

    <div id="viewer-overlay">
        <div class="viewer-nav">
            <button class="back-btn" onclick="closeViewer()">❮ MENU</button>
            <span id="current-title"></span>
            <input type="text" id="search-box" class="search-box" placeholder="Search..." onkeyup="filterTable()">
        </div>
        <div class="table-scroll-box" id="table-output"></div>
    </div>

    <footer class="footer">
        <div>Official Results Portal | v1.4.5</div>
        <div id="sync-time-text">Loading...</div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('meta-title-inject').innerText = MATCH_CONFIG.competitionName;
            document.getElementById('meta-venue-inject').innerText = MATCH_CONFIG.venue.toUpperCase();
            document.getElementById('meta-dates-inject').innerText = MATCH_CONFIG.dates.toUpperCase();
        });

        async function fetchScores() {
            const resp = await fetch('scores.json?v=' + new Date().getTime());
            return await resp.json();
        }

        async function loadExcelTab(tab, title) {
            document.getElementById('current-title').innerText = title;
            document.getElementById('viewer-overlay').style.display = 'flex';
            const output = document.getElementById('table-output');
            output.innerHTML = 'Loading...';

            const data = await fetchScores();
            const anglers = data.anglers;

            if (tab === 'TEAM RESULT') {
                let teams = {};
                anglers.forEach(a => {
                    if (!a.teamName || a.teamName.toUpperCase() === "SOLO") return;
                    if (!teams[a.teamName]) teams[a.teamName] = { name: a.teamName, pts: 0, len: 0, fish: 0, members: [] };
                    teams[a.teamName].pts += a.totals.cumulativePoints;
                    teams[a.teamName].len += a.totals.cumulativeLengthCm;
                    teams[a.teamName].fish += a.totals.cumulativeFish;
                    teams[a.teamName].members.push(a);
                });

                let html = '<table><tr><th>RANK / TEAM NAME</th><th>PTS</th><th>CM</th><th>FISH CT</th><th>TEAM SCORES MATRIX</th></tr>';
                Object.values(teams).sort((a,b) => a.pts - b.pts).forEach((t, i) => {
                    html += `<tr><td><strong>${i+1} ${t.name}</strong></td><td>${t.pts}</td><td>${t.len}</td><td>${t.fish}</td><td><div class="matrix-container">`;
                    t.members.forEach(m => {
                        html += `<div class="matrix-card"><div>${m.anglerName}</div><div>${m.totals.cumulativePoints}PTS / ${m.totals.cumulativeLengthCm}CM / ${m.totals.cumulativeFish}F</div></div>`;
                    });
                    html += '</div></td></tr>';
                });
                output.innerHTML = html + '</table>';
            }
            // Add zone color logic here for ZONE 1 / ZONE 2
        }

        function closeViewer() { document.getElementById('viewer-overlay').style.display = 'none'; }
    </script>
</body>
</html>
