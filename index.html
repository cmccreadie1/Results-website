<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPRA Scottish Shore 2026 | v8.0.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-overlay: rgba(10, 11, 14, 0.88);
            --surface-color: rgba(20, 22, 28, 0.75);
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --glass-border: rgba(0, 242, 255, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #0a0b0e;
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('background.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Branding Header */
        .dynamic-hub { margin-top: 40px; margin-bottom: 30px; width: 100%; display: flex; justify-content: center; }
        
        .hub-pill {
            background: rgba(10, 11, 14, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 8px 25px 8px 10px;
            border-radius: 60px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .logo-box {
            background: white;
            padding: 4px;
            border-radius: 50%;
            width: 52px; height: 52px;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            border: 2px solid var(--accent-cyan);
        }

        .assoc-logo { max-width: 100%; max-height: 100%; object-fit: contain; }

        .hub-text h1 { 
            font-family: 'Oswald', sans-serif; 
            font-size: 0.95rem; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            line-height: 1.2;
        }

        /* Navigation Stack */
        .button-stack { width: 100%; max-width: 450px; padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
        
        .slide-btn {
            background: var(--surface-color);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 18px 22px;
            border-radius: 12px;
            color: var(--text-main);
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            display: flex; justify-content: space-between; align-items: center;
            text-decoration: none; /* For link behavior */
            transition: transform 0.2s ease;
        }

        .slide-btn:active { transform: scale(0.97); background: rgba(0, 242, 255, 0.15); }
        .alt-btn { border-color: rgba(255,255,255,0.3); }
        .divider { height: 1px; background: rgba(255,255,255,0.1); margin: 10px 0; }

        .footer { margin-top: auto; padding: 40px; font-size: 0.65rem; color: rgba(255,255,255,0.4); text-align: center; text-transform: uppercase; }
        .version-tag { color: var(--accent-cyan); font-weight: 700; }
    </style>
</head>
<body>

    <header class="dynamic-hub">
        <div class="hub-pill">
            <div class="logo-box">
                <img src="logo.png" alt="SPRA Logo" class="assoc-logo">
            </div>
            <div class="hub-text">
                <h1>SPRA Scottish<br>Shore 2026</h1>
            </div>
        </div>
    </header>

    <nav class="button-stack">
        <a href="individual.pdf" class="slide-btn" target="_blank">
            <span>Individual Winner</span>
            <span style="color: var(--accent-cyan)">OPEN ❯</span>
        </a>
        <a href="team.pdf" class="slide-btn" target="_blank">
            <span>Team Winners</span>
            <span style="color: var(--accent-cyan)">OPEN ❯</span>
        </a>
        <a href="zone1.pdf" class="slide-btn" target="_blank">
            <span>Zone Day 1</span>
            <span style="color: var(--accent-cyan)">OPEN ❯</span>
        </a>
        <a href="zone2.pdf" class="slide-btn" target="_blank">
            <span>Zone Day 2</span>
            <span style="color: var(--accent-cyan)">OPEN ❯</span>
        </a>
        <a href="biggest.pdf" class="slide-btn" target="_blank">
            <span>Biggest Fish</span>
            <span style="color: var(--accent-cyan)">OPEN ❯</span>
        </a>

        <div class="divider"></div>

        <a href="totals.pdf" class="slide-btn alt-btn" target="_blank">
            <span>Overall Totals</span>
            <span>VIEW ❯</span>
        </a>
        <a href="performance.pdf" class="slide-btn alt-btn" target="_blank">
            <span>Performance Stats</span>
            <span>VIEW ❯</span>
        </a>
    </nav>

    <footer class="footer">
        Native Mobile Results Hub<br>
        SINGLE SOURCE OF TRUTH: <span class="version-tag">v8.0.0</span>
    </footer>

</body>
</html>
