<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPRA Scottish Shore 2026 | v12.0.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@500;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-overlay: rgba(10, 11, 14, 0.85); 
            --surface-color: rgba(20, 22, 28, 0.7); 
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --glass-border: rgba(0, 242, 255, 0.3);
            --card-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #0a0b0e;
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('background.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            padding-bottom: 40px;
        }

        /* Branding Header */
        .dynamic-hub { 
            margin-top: 40px; 
            margin-bottom: 30px; 
            width: 100%; 
            display: flex; 
            justify-content: center; 
        }
        .hub-pill {
            background: rgba(10, 11, 14, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 15px 30px;
            border-radius: 20px;
            display: flex; 
            align-items: center; 
            gap: 20px;
            box-shadow: var(--card-shadow);
        }
        .assoc-logo { 
            height: 60px; 
            width: auto; 
            filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.6)); 
        }
        .hub-text h1 { 
            font-family: 'Oswald', sans-serif; 
            font-size: 1.2rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }

        /* Bento Grid Navigation */
        .bento-grid { 
            width: 100%; 
            max-width: 500px; 
            padding: 0 20px; 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
        }
        .bento-card {
            background: var(--surface-color);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            aspect-ratio: 1 / 1;
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: var(--card-shadow);
        }
        .bento-card span {
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .bento-icon { font-size: 1.5rem; color: var(--accent-cyan); }
        
        .bento-card:active { 
            transform: scale(0.95); 
            background: var(--accent-cyan);
            color: #000;
        }

        /* Full Screen Viewer */
        #viewer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000;
            display: none; flex-direction: column; z-index: 2000;
        }
        .viewer-nav {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            background: #000; border-bottom: 2px solid var(--accent-cyan);
        }
        .back-btn {
            background: var(--accent-cyan); color: #000; border: none; padding: 10px 16px; border-radius: 8px;
            font-family: 'Oswald', sans-serif; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 0.8rem;
        }
        #current-title {
            color: var(--accent-cyan); font-family: 'Oswald'; font-size: 0.9rem; text-transform: uppercase;
        }

        .table-scroll-box {
            flex: 1; overflow-x: auto; overflow-y: auto; padding: 20px; background: #0a0b0e;
        }

        /* Monospace Data Tables */
        table { 
            border-collapse: collapse; 
            width: 100%; 
            color: #fff; 
            font-family: 'Roboto Mono', monospace; 
            font-size: 0.85rem; 
        }
        th {
            background: #111; 
            color: var(--accent-cyan); 
            font-family: 'Oswald', sans-serif; 
            text-transform: uppercase;
            padding: 12px; 
            text-align: left; 
            border-bottom: 1px solid var(--glass-border);
        }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* Skeleton Animation */
        .skeleton-wrapper { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .skeleton-row { height: 30px; background: #1a1e26; border-radius: 8px; position: relative; overflow: hidden; }
        .skeleton-row::after {
            content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        .footer { margin-top: auto; padding: 20px; font-size: 0.6rem; color: rgba(255,255,255,0.4); text-align: center; text-transform: uppercase; }
    </style>
</head>
<body>

    <header class="dynamic-hub">
        <div class="hub-pill">
            <img src="logo.png" alt="SPRA Logo" class="assoc-logo">
            <div class="hub-text">
                <h1>SPRA Scottish<br>Shore 2026</h1>
            </div>
        </div>
    </header>

    <main class="bento-grid">
        <div class="bento-card" onclick="loadExcelTab('INDIVIDUAL RESULT', 'Individual Winner')">
            <div class="bento-icon">👤</div>
            <span>Individual</span>
        </div>
        <div class="bento-card" onclick="loadExcelTab('TEAM RESULT', 'Team Result')">
            <div class="bento-icon">👥</div>
            <span>Teams</span>
        </div>
        <div class="bento-card" onclick="loadExcelTab('ZONE 1', 'Zone Day 1')">
            <div class="bento-icon">📍</div>
            <span>Zone 1</span>
        </div>
        <div class="bento-card" onclick="loadExcelTab('ZONE 2', 'Zone Day 2')">
            <div class="bento-icon">📍</div>
            <span>Zone 2</span>
        </div>
        <div class="bento-card" onclick="loadExcelTab('SECRET PAIRS LIVE', 'Secret Pairs')">
            <div class="bento-icon">🃏</div>
            <span>Pairs</span>
        </div>
        <div class="bento-card" onclick="loadExcelTab('BIGGEST FISH', 'Biggest Fish')">
            <div class="bento-icon">🏆</div>
            <span>Biggest</span>
        </div>
    </main>

    <div id="viewer-overlay">
        <div class="viewer-nav">
            <button class="back-btn" onclick="closeViewer()">❮ BACK</button>
            <span id="current-title"></span>
        </div>
        <div class="table-scroll-box" id="table-output"></div>
    </div>

    <footer class="footer">
        Official Results Portal | v12.0.0
    </footer>

    <script>
        const TAB_CONFIG = {
            'INDIVIDUAL RESULT': { 
                startCol: 0, endCol: 4, skipRows: 3, 
                staticRules: ["<strong>Winner:</strong> Lowest Zone Points", "<strong>If Tied:</strong> Length (cm) ➔ Fish Count ➔ Biggest Fish ➔ Daily Species"]
            }, 
            'TEAM RESULT': { startCol: 0, endCol: 8, skipRows: 1 },       
            'BIGGEST FISH': { startCol: 0, endCol: 4, skipRows: 1 },      
            'SECRET PAIRS LIVE': { startCol: 4, endCol: 6, skipRows: 2 }, 
            'ZONE 1': { isMultiZone: true, skipRows: 1 },                 
            'ZONE 2': { isMultiZone: true, skipRows: 1 }                  
        };

        const ALLOWED_TABS = ['ZONE 1', 'ZONE 2', 'INDIVIDUAL RESULT', 'TEAM RESULT', 'BIGGEST FISH', 'SECRET PAIRS LIVE'];
        let cachedWorkbook = null;

        async function fetchWorkbook() {
            if (cachedWorkbook !== null) {
                return cachedWorkbook;
            }
            const timestampForFetch = new Date().getTime();
            const response = await fetch('scores.xlsx?v=' + timestampForFetch);
            if (response.ok === false) {
                throw new Error("Workbook file not found.");
            }
            const arrayBuffer = await response.arrayBuffer();
            cachedWorkbook = XLSX.read(arrayBuffer, { type: "array" });
            return cachedWorkbook;
        }

        async function loadExcelTab(targetTabName, displayTitle) {
            const overlay = document.getElementById('viewer-overlay');
            const output = document.getElementById('table-output');
            const titleDisplay = document.getElementById('current-title');
            
            titleDisplay.innerText = displayTitle;
            
            output.innerHTML = `
                <div class="skeleton-wrapper">
                    <div class="skeleton-row"></div><div class="skeleton-row"></div>
                    <div class="skeleton-row"></div><div class="skeleton-row"></div>
                </div>
            `;
            
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';

            await new Promise(function(resolve) {
                setTimeout(resolve, 400);
            });

            try {
                const workbook = await fetchWorkbook();
                let foundSheet = null;
                for (let i = 0; i < workbook.SheetNames.length; i++) {
                    let sheetName = workbook.SheetNames[i];
                    if (sheetName.trim().toUpperCase() === targetTabName.trim().toUpperCase()) {
                        foundSheet = sheetName;
                    }
                }

                if (foundSheet === null) {
                    output.innerHTML = '<div style="padding:20px; color:#fff;">Sheet not found.</div>';
                    return;
                }

                const worksheet = workbook.Sheets[foundSheet];
                const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                const limits = TAB_CONFIG[targetTabName.trim().toUpperCase()];
                
                let htmlMarkup = '';
                if (limits.staticRules !== undefined) {
                    htmlMarkup += '<div style="background:rgba(0,242,255,0.05); padding:10px; margin-bottom:20px; border-radius:10px; font-size:0.75rem; color:#fff;">';
                    for (let i = 0; i < limits.staticRules.length; i++) {
                        htmlMarkup += '<div>▪ ' + limits.staticRules[i] + '</div>';
                    }
                    htmlMarkup += '</div>';
                }

                const processedData = rawData.slice(limits.skipRows || 0);
                htmlMarkup += '<table>';
                
                for (let r = 0; r < processedData.length; r++) {
                    const row = processedData[r];
                    let isEmpty = true;
                    for (let c = 0; c < row.length; c++) {
                        if (String(row[c]).trim() !== "") isEmpty = false;
                    }
                    if (isEmpty === true) continue;

                    htmlMarkup += '<tr>';
                    for (let c = 0; c < row.length; c++) {
                        htmlMarkup += '<td>' + String(row[c]) + '</td>';
                    }
                    htmlMarkup += '</tr>';
                }
                htmlMarkup += '</table>';
                
                output.innerHTML = htmlMarkup;
            } catch (error) {
                output.innerHTML = '<div style="padding:20px; color:#ff4444;">No Data Available</div>';
            }
        }

        function closeViewer() {
            document.getElementById('viewer-overlay').style.display = 'none';
            document.getElementById('table-output').innerHTML = '';
            document.body.style.overflow = 'auto';
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js')
                    .then(function(registration) {
                        console.log('v12.0.0 registered');
                    })
                    .catch(function(err) {
                        console.error('SW failed', err);
                    });
            });
        }
    </script>
</body>
</html>
