<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPRA Scottish Shore 2026 | v11.5.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-overlay: rgba(10, 11, 14, 0.75); 
            --surface-color: rgba(20, 22, 28, 0.65); 
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --glass-border: rgba(0, 242, 255, 0.4);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            background-color: #0a0b0e;
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('background.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }

        /* Branding Header */
        .dynamic-hub { 
            margin-top: 40px; 
            margin-bottom: 20px; 
            width: 100%; 
            display: flex; 
            justify-content: center; 
        }
        .hub-pill {
            background: rgba(10, 11, 14, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 12px 25px;
            border-radius: 15px;
            display: flex; 
            align-items: center; 
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .assoc-logo { 
            height: 60px; 
            width: auto; 
            filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.4)); 
        }
        .hub-text h1 { 
            font-family: 'Oswald', sans-serif; 
            font-size: 1.1rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }

        /* Live Status Badge */
        .live-status-badge {
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            margin-bottom: 25px; 
            color: #999;
            font-size: 0.7rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-weight: bold;
        }
        .pulse-dot {
            width: 7px; 
            height: 7px; 
            background-color: var(--accent-cyan); 
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan); 
            animation: flash 2s infinite;
        }

        /* Navigation Menu Stack */
        .button-stack { 
            width: 100%; 
            max-width: 450px; 
            padding: 0 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .slide-btn {
            background: var(--surface-color);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
            padding: 20px 24px;
            border-radius: 12px;
            color: var(--text-main);
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            transition: all 0.1s ease;
        }
        .slide-btn:active { 
            transform: scale(0.96); 
            background: var(--accent-cyan);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 20px var(--accent-cyan);
        }
        .divider { 
            height: 1px; 
            background: rgba(255,255,255,0.2); 
            margin: 10px 0; 
            width: 100%; 
        }

        /* Full Screen Native Table Viewer Overlay */
        #viewer-overlay {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #000;
            display: none; 
            flex-direction: column; 
            z-index: 2000;
        }
        .viewer-nav {
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: #000; 
            border-bottom: 2px solid var(--accent-cyan); 
            flex-shrink: 0; 
            z-index: 20; 
        }
        .back-btn {
            background: var(--accent-cyan); 
            color: #000; 
            border: none; 
            padding: 10px 16px; 
            border-radius: 8px;
            font-family: 'Oswald', sans-serif; 
            font-weight: 700; 
            cursor: pointer; 
            text-transform: uppercase; 
            font-size: 0.9rem;
        }
        #current-title {
            color: var(--accent-cyan); 
            font-family: 'Oswald'; 
            font-size: 0.9rem; 
            text-transform: uppercase;
            flex-grow: 1; 
            text-align: center; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
        }
        .search-box {
            background: #111; 
            border: 1px solid var(--accent-cyan); 
            color: #fff; 
            padding: 8px 15px; 
            border-radius: 20px;
            font-family: 'Inter', sans-serif; 
            font-size: 0.85rem; 
            outline: none; 
            width: 130px; 
            transition: width 0.3s;
        }
        .search-box:focus { 
            width: 180px; 
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.3); 
        }

        /* Scroll Hint Indicator */
        .scroll-hint {
            background: #000;
            color: var(--accent-cyan);
            font-family: 'Oswald', sans-serif;
            font-size: 0.75rem;
            text-align: center;
            padding: 8px;
            border-bottom: 1px solid #333;
            text-transform: uppercase;
            letter-spacing: 1px;
            pointer-events: none;
        }

        .table-scroll-box {
            flex: 1; 
            overflow-x: auto; 
            overflow-y: auto; 
            padding: 0 15px 15px 15px; 
            background: #11141a;
            -webkit-overflow-scrolling: touch;
        }

        /* Ribbon Styles */
        .info-banner {
            background: rgba(0, 242, 255, 0.03); 
            border: 1px solid rgba(0, 242, 255, 0.25); 
            border-radius: 6px;
            padding: 8px 12px; 
            margin: 12px auto 15px auto; 
            max-width: 95%; 
            color: rgba(255, 255, 255, 0.75);
            font-family: 'Inter', sans-serif; 
            font-size: 0.75rem; 
            line-height: 1.4; 
            text-align: center;
        }
        .banner-bullet { 
            color: var(--accent-cyan); 
            margin-right: 5px; 
            font-weight: bold; 
        }
        .rule-segment { 
            margin-right: 12px; 
            display: inline-block; 
        }

        /* Skeleton Animation */
        .skeleton-wrapper { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            margin-top: 20px; 
        }
        .skeleton-row { 
            height: 40px; 
            background: #1a1e26; 
            border-radius: 4px; 
            position: relative; 
            overflow: hidden; 
        }
        .skeleton-row::after {
            content: ""; 
            position: absolute; 
            top: 0; 
            right: 0; 
            bottom: 0; 
            left: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 
            0% { transform: translateX(-100%); } 
            100% { transform: translateX(100%); } 
        }

        /* Table Styles */
        table { 
            border-collapse: separate; 
            border-spacing: 0; 
            width: 100%; 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            font-size: 0.9rem; 
            margin-bottom: 30px; 
            white-space: nowrap; 
        }
        table:first-child { margin-top: 15px; }
        th {
            background: #000; 
            color: var(--accent-cyan); 
            font-family: 'Oswald', sans-serif; 
            text-transform: uppercase;
            font-weight: 700; 
            letter-spacing: 1px; 
            padding: 14px 12px; 
            border-bottom: 2px solid var(--accent-cyan);
            position: sticky; 
            top: 0; 
            z-index: 10;
        }
        td { padding: 14px 12px; }
        tr:nth-child(even) td { background: rgba(255, 255, 255, 0.08); }
        tr:nth-child(odd) td { background: rgba(0, 0, 0, 0.4); }

        .zone-red { color: #ff5252; } 
        .zone-yellow { color: #ffd600; } 
        .zone-green { color: #00e676; } 
        .zone-blue { color: #448aff; }
        table.zone-red th { border-bottom-color: #ff5252; color: #ff5252; }
        table.zone-yellow th { border-bottom-color: #ffd600; color: #ffd600; }
        table.zone-green th { border-bottom-color: #00e676; color: #00e676; }
        table.zone-blue th { border-bottom-color: #448aff; color: #448aff; }

        .status-msg { 
            font-family: 'Oswald', sans-serif; 
            color: #ff4444; 
            text-align: center; 
            padding: 40px 20px; 
            text-transform: uppercase; 
            font-size: 1.1rem; 
        }
        
        /* NEW: Match Stats Dashboard Styles */
        .stat-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--surface-color);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.05), 0 5px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        .stat-title {
            color: var(--accent-cyan);
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .stat-value {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 5px;
        }
        .stat-sub {
            font-size: 0.9rem;
            color: #aaa;
            font-weight: 400;
        }
        .stat-desc {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .footer { 
            margin-top: auto; 
            padding: 40px; 
            font-size: 0.7rem; 
            color: rgba(255,255,255,0.6); 
            text-align: center; 
            text-transform: uppercase; 
        }
        @keyframes flash { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.4; } 
        }
    </style>
</head>
<body>

    <header class="dynamic-hub">
        <div class="hub-pill">
            <img src="logo.png" alt="SPRA Logo" class="assoc-logo">
            <div class="hub-text">
                <h1>SPRA Scottish<br>Shore 2026</h1>
            </div>
        </div>
    </header>

    <div class="live-status-badge">
        <div class="pulse-dot"></div>
        <span id="sync-time-text">Data Synced: Checking...</span>
    </div>

    <nav class="button-stack">
        <div class="slide-btn" onclick="loadExcelTab('INDIVIDUAL RESULT', 'Individual Winner')">
            <span>Individual Winner</span>
            <span style="color: var(--accent-cyan)">VIEW ❯</span>
        </div>
        <div class="slide-btn" onclick="loadExcelTab('TEAM RESULT', 'Team Result')">
            <span>Team Winners</span>
            <span style="color: var(--accent-cyan)">VIEW ❯</span>
        </div>
        <div class="slide-btn" onclick="loadExcelTab('SECRET PAIRS', 'Secret Pairs')">
            <span>Secret Pairs</span>
            <span style="color: var(--accent-cyan)">VIEW ❯</span>
        </div>
        
        <div class="divider"></div>
        
        <div class="slide-btn" onclick="loadMatchStats('Match Stats')">
            <span>Match Stats</span>
            <span style="color: var(--accent-cyan)">VIEW ❯</span>
        </div>

        <div class="divider"></div>

        <div class="slide-btn" onclick="loadExcelTab('ZONE 1', 'Zone Day 1')">
            <span>Zone Day 1</span>
            <span style="color: var(--accent-cyan)">VIEW ❯</span>
        </div>
        <div class="slide-btn" onclick="loadExcelTab('ZONE 2', 'Zone Day 2')">
            <span>Zone Day 2</span>
            <span style="color: var(--accent-cyan)">VIEW ❯</span>
        </div>
        
        <div class="divider"></div>

        <div class="slide-btn" onclick="loadExcelTab('BIGGEST FISH', 'Biggest Fish')">
            <span>Biggest Fish</span>
            <span style="color: var(--accent-cyan)">VIEW ❯</span>
        </div>
    </nav>

    <div id="viewer-overlay">
        <div class="viewer-nav">
            <button class="back-btn" onclick="closeViewer()">❮ MENU</button>
            <span id="current-title"></span>
            <input type="text" id="search-box" class="search-box" placeholder="Find Angler..." onkeyup="filterTable()">
        </div>
        <div class="scroll-hint">Swipe table to view columns ➔</div>
        <div class="table-scroll-box" id="table-output"></div>
    </div>

    <footer class="footer">
        Official Results Portal | v11.5.0
    </footer>

    <script>
        // CONFIGURATION: Map columns and determine skip rows.
        const TAB_CONFIG = {
            'INDIVIDUAL RESULT': { 
                isIndividualCustom: true,
                skipRows: 1, 
                staticRules: [
                    "<strong>Winner:</strong> Lowest Zone Points", 
                    "<strong>If Tied:</strong> Length (cm) ➔ then Fish Count ➔ then Biggest Fish ➔ then Daily Species"
                ]
            }, 
            'TEAM RESULT': { 
                startCol: 0, 
                endCol: 8, 
                skipRows: 1 
            },       
            'BIGGEST FISH': { 
                startCol: 0, 
                endCol: 4, 
                skipRows: 1 
            },      
            'SECRET PAIRS': { 
                startCol: 0, 
                endCol: 2,   
                skipRows: 2 
            }, 
            'ZONE 1': { 
                isMultiZone: true, 
                skipRows: 1 
            },                 
            'ZONE 2': { 
                isMultiZone: true, 
                skipRows: 1 
            }                  
        };

        const ALLOWED_TABS = [
            'ZONE 1', 
            'ZONE 2', 
            'INDIVIDUAL RESULT', 
            'TEAM RESULT',
            'BIGGEST FISH',
            'SECRET PAIRS'
        ];

        let cachedWorkbook = null;

        document.addEventListener("DOMContentLoaded", updateSyncTime);

        async function updateSyncTime() {
            try {
                const timestampForFetch = new Date().getTime();
                const response = await fetch('scores.xlsx?v=' + timestampForFetch, { method: 'HEAD' });
                
                if (response.ok === true) {
                    const lastMod = response.headers.get('Last-Modified');
                    if (lastMod !== null) {
                        const dateObj = new Date(lastMod);
                        const displayDate = dateObj.toLocaleDateString();
                        const displayTime = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                        document.getElementById('sync-time-text').innerText = 'Data Synced: ' + displayDate + ', ' + displayTime;
                        return;
                    }
                }
                document.getElementById('sync-time-text').innerText = 'Data Synced: Live Ready';
            } catch (error) { 
                document.getElementById('sync-time-text').innerText = 'Data Synced: Offline (Cached Version)'; 
            }
        }

        async function fetchWorkbook() {
            if (cachedWorkbook !== null) {
                return cachedWorkbook;
            }

            const timestampForFetch = new Date().getTime();
            const response = await fetch('scores.xlsx?v=' + timestampForFetch);
            
            if (response.ok === false) {
                throw new Error("Workbook file not found.");
            }

            const arrayBuffer = await response.arrayBuffer();
            cachedWorkbook = XLSX.read(arrayBuffer, { type: "array" });
            return cachedWorkbook;
        }

        function filterTable() {
            const inputField = document.getElementById('search-box');
            const filterValue = inputField.value.toUpperCase();
            const tables = document.querySelectorAll('#table-output table');
            
            tables.forEach(function(table) {
                const tableRows = table.getElementsByTagName('tr');
                for (let i = 1; i < tableRows.length; i++) {
                    const rowText = tableRows[i].innerText.toUpperCase();
                    if (rowText.includes(filterValue) === true) {
                        tableRows[i].style.display = "";
                    } else {
                        tableRows[i].style.display = "none";
                    }
                }
            });
        }

        // NEW: Function specifically built to read the data and output curated Fun Facts
        async function loadMatchStats(displayTitle) {
            const overlay = document.getElementById('viewer-overlay');
            const output = document.getElementById('table-output');
            const titleDisplay = document.getElementById('current-title');
            
            // Hide the search box and scroll hint for the dashboard
            document.getElementById('search-box').style.display = 'none';
            document.querySelector('.scroll-hint').style.display = 'none';
            document.getElementById('search-box').value = '';
            titleDisplay.innerText = displayTitle;
            
            output.innerHTML = `
                <div class="skeleton-wrapper">
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                </div>
            `;
            
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';

            await new Promise(function(resolve) {
                setTimeout(resolve, 400);
            });

            try {
                const workbook = await fetchWorkbook();
                
                let foundSheet = null;
                for (let i = 0; i < workbook.SheetNames.length; i++) {
                    let sheetName = workbook.SheetNames[i];
                    if (sheetName.trim().toUpperCase() === 'INDIVIDUAL RESULT') {
                        foundSheet = sheetName;
                    }
                }

                if (foundSheet === null) {
                    output.innerHTML = '<div class="status-msg">Section Offline: Data sheet could not be located.</div>';
                    return;
                }

                const worksheet = workbook.Sheets[foundSheet];
                const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                
                // Variables for running calculations
                let totalFish = 0;
                let day1Fish = 0;
                let day2Fish = 0;
                let totalLengthCm = 0;

                let maxFish = -1; let maxFishAngler = "";
                let maxSpec = -1; let maxSpecAngler = "";
                let maxBig = -1;  let maxBigAngler = "";

                let maxAvgLen = -1; let maxAvgAngler = ""; let maxAvgFishCt = 0;
                let minAvgLen = 999999; let minAvgAngler = ""; let minAvgFishCt = 0;

                let maxImprovement = -999; let comebackAngler = ""; let comebackD1 = 0; let comebackD2 = 0;

                // Loop through all data skipping the headers
                for (let r = 1; r < rawData.length; r++) {
                    let row = rawData[r];
                    let name = String(row[1] || "").trim();
                    
                    if (name === "" || name === "ANGLER NAME") {
                        continue;
                    }

                    // Extract strict columns mapping to Day 1, Day 2, and Combined
                    let d1Fish = parseFloat(row[6]) || 0;
                    let d2Fish = parseFloat(row[12]) || 0;
                    let cLen = parseFloat(row[17]) || 0;
                    let cFish = parseFloat(row[18]) || 0;
                    let cBig = parseFloat(row[19]) || 0;
                    let cSpec = parseFloat(row[20]) || 0;

                    // USER REQUIREMENT: Ignore anyone with 0 fish (The Wooden Spoon)
                    if (cFish === 0) {
                        continue; 
                    }

                    // Sums
                    totalFish += cFish;
                    day1Fish += d1Fish;
                    day2Fish += d2Fish;
                    totalLengthCm += cLen;

                    // Standard Maximums
                    if (cFish > maxFish) { maxFish = cFish; maxFishAngler = name; }
                    if (cSpec > maxSpec) { maxSpec = cSpec; maxSpecAngler = name; }
                    if (cBig > maxBig) { maxBig = cBig; maxBigAngler = name; }

                    // Averages
                    let avgLen = cLen / cFish;
                    if (cFish >= 5 && avgLen > maxAvgLen) { 
                        maxAvgLen = avgLen; maxAvgAngler = name; maxAvgFishCt = cFish; 
                    }
                    if (cFish >= 10 && avgLen < minAvgLen) { 
                        minAvgLen = avgLen; minAvgAngler = name; minAvgFishCt = cFish; 
                    }

                    // Improvement
                    let improvement = d2Fish - d1Fish;
                    if (improvement > maxImprovement) { 
                        maxImprovement = improvement; comebackAngler = name; comebackD1 = d1Fish; comebackD2 = d2Fish; 
                    }
                }

                let htmlMarkup = '<div class="stat-grid">';
                
                // 1. Grand Total Card
                htmlMarkup += '<div class="stat-card">';
                htmlMarkup += '<div class="stat-title">The Grand Total</div>';
                htmlMarkup += '<div class="stat-value">' + totalFish + ' <span class="stat-sub">Fish</span></div>';
                htmlMarkup += '<div class="stat-desc">Day 1: ' + day1Fish + ' | Day 2: ' + day2Fish + '</div>';
                htmlMarkup += '</div>';

                // 2. Endurance Card
                let totalMeters = (totalLengthCm / 100).toFixed(2);
                htmlMarkup += '<div class="stat-card">';
                htmlMarkup += '<div class="stat-title">Tape Measure Stat</div>';
                htmlMarkup += '<div class="stat-value">' + totalMeters + ' <span class="stat-sub">Meters</span></div>';
                htmlMarkup += '<div class="stat-desc">If laid end-to-end on the beach!</div>';
                htmlMarkup += '</div>';

                // 3. The Machine Card
                htmlMarkup += '<div class="stat-card">';
                htmlMarkup += '<div class="stat-title">The Machine</div>';
                htmlMarkup += '<div class="stat-value">' + maxFishAngler + '</div>';
                htmlMarkup += '<div class="stat-desc">Highest volume overall with ' + maxFish + ' fish caught.</div>';
                htmlMarkup += '</div>';

                // 4. Species Hunter Card
                htmlMarkup += '<div class="stat-card">';
                htmlMarkup += '<div class="stat-title">Species Hunter</div>';
                htmlMarkup += '<div class="stat-value">' + maxSpecAngler + '</div>';
                htmlMarkup += '<div class="stat-desc">Caught ' + maxSpec + ' different species.</div>';
                htmlMarkup += '</div>';

                // 5. Monster Fish Card
                htmlMarkup += '<div class="stat-card">';
                htmlMarkup += '<div class="stat-title">Monster Catch</div>';
                htmlMarkup += '<div class="stat-value">' + maxBigAngler + '</div>';
                htmlMarkup += '<div class="stat-desc">Landed an absolute unit measuring ' + maxBig + ' cm.</div>';
                htmlMarkup += '</div>';

                // 6. Quality Over Quantity Card
                if (maxAvgLen > -1) {
                    htmlMarkup += '<div class="stat-card">';
                    htmlMarkup += '<div class="stat-title">Quality Over Quantity</div>';
                    htmlMarkup += '<div class="stat-value">' + maxAvgAngler + '</div>';
                    htmlMarkup += '<div class="stat-desc">Averaged a massive ' + maxAvgLen.toFixed(1) + ' cm across ' + maxAvgFishCt + ' fish.</div>';
                    htmlMarkup += '</div>';
                }

                // 7. Sprat King Card
                if (minAvgLen !== 999999) {
                    htmlMarkup += '<div class="stat-card">';
                    htmlMarkup += '<div class="stat-title">Sprat King</div>';
                    htmlMarkup += '<div class="stat-value">' + minAvgAngler + '</div>';
                    htmlMarkup += '<div class="stat-desc">Worked hard for ' + minAvgFishCt + ' fish, but averaged only ' + minAvgLen.toFixed(1) + ' cm!</div>';
                    htmlMarkup += '</div>';
                }

                // 8. Comeback Kid Card
                htmlMarkup += '<div class="stat-card">';
                htmlMarkup += '<div class="stat-title">Comeback Kid</div>';
                htmlMarkup += '<div class="stat-value">' + comebackAngler + '</div>';
                htmlMarkup += '<div class="stat-desc">Day 1: ' + comebackD1 + ' ➔ Day 2: ' + comebackD2 + ' (+' + maxImprovement + ' fish)</div>';
                htmlMarkup += '</div>';

                htmlMarkup += '</div>';
                
                output.innerHTML = htmlMarkup;

            } catch (error) {
                console.error(error);
                output.innerHTML = '<div class="status-msg">No Data Active<br><span style="font-size:0.8rem; color:#666;">Ensure master workbook is uploaded to GitHub as \'scores.xlsx\'</span></div>';
            }
        }

        async function loadExcelTab(targetTabName, displayTitle) {
            const overlay = document.getElementById('viewer-overlay');
            const output = document.getElementById('table-output');
            const titleDisplay = document.getElementById('current-title');
            
            // Restore visibility of standard features
            document.getElementById('search-box').style.display = 'block';
            document.querySelector('.scroll-hint').style.display = 'block';
            
            document.getElementById('search-box').value = '';
            titleDisplay.innerText = displayTitle;
            
            // Show Skeleton Loader
            output.innerHTML = `
                <div class="skeleton-wrapper">
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                </div>
            `;
            
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';

            // ARTIFICIAL DELAY FOR POLISH (400ms)
            await new Promise(function(resolve) {
                setTimeout(resolve, 400);
            });

            try {
                const workbook = await fetchWorkbook();
                
                let foundSheet = null;
                for (let i = 0; i < workbook.SheetNames.length; i++) {
                    let sheetName = workbook.SheetNames[i];
                    if (sheetName.trim().toUpperCase() === targetTabName.trim().toUpperCase()) {
                        foundSheet = sheetName;
                    }
                }

                if (foundSheet === null) {
                    output.innerHTML = '<div class="status-msg">Section Offline: Data sheet ' + targetTabName + ' could not be located.</div>';
                    return;
                }

                const worksheet = workbook.Sheets[foundSheet];
                const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                
                const limits = TAB_CONFIG[targetTabName.trim().toUpperCase()];
                
                let htmlMarkup = '';

                // SINGLE LINE RIBBON GENERATOR WITH SPACING
                if (limits.staticRules !== undefined) {
                    htmlMarkup += '<div class="info-banner">';
                    for (let i = 0; i < limits.staticRules.length; i++) {
                        htmlMarkup += '<span class="rule-segment"><span class="banner-bullet">▪</span>' + limits.staticRules[i] + '</span>';
                    }
                    htmlMarkup += '</div>';
                }

                const processedData = rawData.slice(limits.skipRows || 0);

                if (limits.isMultiZone === true) {
                    const zoneBlocks = [
                        { name: 'Red Zone', start: 1, end: 4, colorClass: 'zone-red' },       
                        { name: 'Yellow Zone', start: 6, end: 9, colorClass: 'zone-yellow' }, 
                        { name: 'Green Zone', start: 11, end: 14, colorClass: 'zone-green' }, 
                        { name: 'Blue Zone', start: 16, end: 19, colorClass: 'zone-blue' }    
                    ];

                    for (let z = 0; z < zoneBlocks.length; z++) {
                        const block = zoneBlocks[z];
                        let blockHasData = false;
                        let blockHtml = '<h3 class="' + block.colorClass + '" style="margin: 25px 0 10px; font-family: \'Oswald\'; text-transform: uppercase;">' + block.name + '</h3>';
                        blockHtml += '<table class="' + block.colorClass + '">';
                        let isFirstRow = true;

                        for (let r = 0; r < processedData.length; r++) {
                            const row = processedData[r];
                            const slicedRow = row.slice(block.start, block.end + 1);
                            
                            let isEmpty = true;
                            for (let c = 0; c < slicedRow.length; c++) {
                                let checkContent = String(slicedRow[c]).trim();
                                if (checkContent !== "" && checkContent !== "///" && checkContent !== "/") {
                                    isEmpty = false;
                                }
                            }
                            if (isEmpty === true) continue;
                            
                            blockHasData = true;
                            blockHtml += '<tr>';
                            
                            for (let c = 0; c < slicedRow.length; c++) {
                                let cellContent = String(slicedRow[c]).trim();
                                let displayContent = cellContent;
                                
                                if (isFirstRow === false && c === 0) {
                                    if (cellContent === "1") displayContent = "🥇 " + cellContent;
                                    else if (cellContent === "2") displayContent = "🥈 " + cellContent;
                                    else if (cellContent === "3") displayContent = "🥉 " + cellContent;
                                }

                                if (isFirstRow === true) {
                                    blockHtml += '<th>' + displayContent + '</th>';
                                } else {
                                    blockHtml += '<td>' + displayContent + '</td>';
                                }
                            }
                            
                            blockHtml += '</tr>';
                            isFirstRow = false;
                        }
                        
                        blockHtml += '</table>';
                        
                        if (blockHasData === true) {
                            htmlMarkup += blockHtml;
                        }
                    }
                } else {
                    let isFirstRow = true;
                    let layoutClass = "";
                    if (limits.startCol === 0 || limits.isIndividualCustom === true) {
                        layoutClass = 'class="table-layout-standard"';
                    }
                    htmlMarkup += '<div ' + layoutClass + '><table>';

                    for (let r = 0; r < processedData.length; r++) {
                        const row = processedData[r];
                        let slicedRow = [];

                        if (limits.isIndividualCustom === true) {
                            let colA = row[0]; if (colA === undefined) colA = "";
                            let colB = row[1]; if (colB === undefined) colB = "";
                            let colC = row[2]; if (colC === undefined) colC = "";
                            
                            let colQ = row[16]; if (colQ === undefined) colQ = "";
                            let colR = row[17]; if (colR === undefined) colR = "";
                            let colS = row[18]; if (colS === undefined) colS = "";
                            let colT = row[19]; if (colT === undefined) colT = "";
                            let colU = row[20]; if (colU === undefined) colU = "";

                            let isEmpty = true;
                            if (String(colA).trim() !== "" || String(colB).trim() !== "") {
                                isEmpty = false;
                            }
                            if (isEmpty === true) continue;

                            if (isFirstRow === true) {
                                slicedRow = ["RANK", "ANGLER NAME", "TEAM", "PTS", "P.N.B.S"];
                            } else {
                                let combined = String(colR).trim() + " | " + String(colS).trim() + " | " + String(colT).trim() + " | " + String(colU).trim();
                                slicedRow = [String(colA).trim(), String(colB).trim(), String(colC).trim(), String(colQ).trim(), combined];
                            }
                        } else {
                            slicedRow = row.slice(limits.startCol, limits.endCol + 1);
                            
                            let isEmpty = true;
                            for (let c = 0; c < slicedRow.length; c++) {
                                let checkContent = String(slicedRow[c]).trim();
                                if (checkContent !== "" && checkContent !== "///" && checkContent !== "/") {
                                    isEmpty = false;
                                }
                            }
                            if (isEmpty === true) continue;
                        }

                        htmlMarkup += '<tr>';
                        for (let c = 0; c < slicedRow.length; c++) {
                            let cellContent = String(slicedRow[c]).trim();
                            let displayContent = cellContent;
                            
                            if (isFirstRow === false && c === 0) {
                                if (cellContent === "1") displayContent = "🥇 " + cellContent;
                                else if (cellContent === "2") displayContent = "🥈 " + cellContent;
                                else if (cellContent === "3") displayContent = "🥉 " + cellContent;
                            }

                            if (isFirstRow === true) {
                                htmlMarkup += '<th>' + displayContent + '</th>';
                            } else {
                                htmlMarkup += '<td>' + displayContent + '</td>';
                            }
                        }
                        
                        htmlMarkup += '</tr>';
                        isFirstRow = false; 
                    }

                    htmlMarkup += '</table></div>';
                }

                output.innerHTML = htmlMarkup;

            } catch (error) {
                console.error(error);
                output.innerHTML = '<div class="status-msg">No Data Active<br><span style="font-size:0.8rem; color:#666;">Ensure master workbook is uploaded to GitHub as \'scores.xlsx\'</span></div>';
            }
        }

        function closeViewer() {
            document.getElementById('viewer-overlay').style.display = 'none';
            document.getElementById('table-output').innerHTML = '';
            document.getElementById('search-box').value = '';
            document.body.style.overflow = 'auto';
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js')
                    .then(function(registration) {
                        console.log('v11.5.0 registered');
                    })
                    .catch(function(err) {
                        console.error('SW failed', err);
                    });
            });
        }
    </script>
