<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPRA Scottish Shore 2026 | v7.7.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0b0e;
            --surface-color: rgba(25, 28, 35, 0.95);
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --glass-border: rgba(0, 242, 255, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background: radial-gradient(circle at center, #1a1f26 0%, #0a0b0e 100%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        .dynamic-hub { margin-top: 50px; margin-bottom: 40px; }
        .hub-pill {
            background: var(--surface-color);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 12px 30px;
            border-radius: 50px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.15);
        }
        .hub-status { width: 8px; height: 8px; background: var(--accent-cyan); border-radius: 50%; box-shadow: 0 0 10px var(--accent-cyan); animation: pulse 2s infinite; }
        h1 { font-family: 'Oswald', sans-serif; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; }

        .button-stack { width: 100%; max-width: 450px; padding: 0 20px; display: flex; flex-direction: column; gap: 15px; }

        .slide-btn {
            background: var(--surface-color);
            border: 1px solid var(--glass-border);
            padding: 22px;
            border-radius: 14px;
            color: var(--text-main);
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.3s ease;
        }

        .slide-btn:hover { transform: translateX(10px); border-color: var(--accent-cyan); background: rgba(40, 45, 55, 1); }

        /* PDF Viewer Modal */
        #viewer-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98);
            display: none; flex-direction: column; z-index: 1000;
        }

        .viewer-header { 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--glass-border);
            background: var(--bg-color);
        }

        .viewer-actions { display: flex; gap: 10px; }

        .action-btn {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-size: 0.8rem;
            border: none;
        }

        .download-btn { background: #ffffff; color: #000; text-decoration: none; display: flex; align-items: center; }
        .close-btn { background: var(--accent-cyan); color: #000; }

        iframe { width: 100%; height: 100%; border: none; background: #fff; }

        .footer { margin-top: auto; padding: 40px; font-size: 0.7rem; color: #444; text-align: center; }
        .version-tag { color: var(--accent-cyan); font-weight: 700; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <header class="dynamic-hub">
        <div class="hub-pill">
            <div class="hub-status"></div>
            <h1>SPRA Scottish Shore 2026</h1>
        </div>
    </header>

    <nav class="button-stack">
        <div class="slide-btn" onclick="openPDF('individual.pdf', 'Individual Result')">
            <span>Individual Winner</span>
            <span style="color: var(--accent-cyan)">PDF ❯</span>
        </div>
        <div class="slide-btn" onclick="openPDF('team.pdf', 'Team Result')">
            <span>Team Winners</span>
            <span style="color: var(--accent-cyan)">PDF ❯</span>
        </div>
        <div class="slide-btn" onclick="openPDF('zone1.pdf', 'Zone Day 1')">
            <span>Zone Day 1</span>
            <span style="color: var(--accent-cyan)">PDF ❯</span>
        </div>
        <div class="slide-btn" onclick="openPDF('zone2.pdf', 'Zone Day 2')">
            <span>Zone Day 2</span>
            <span style="color: var(--accent-cyan)">PDF ❯</span>
        </div>
        <div class="slide-btn" onclick="openPDF('biggest.pdf', 'Biggest Fish')">
            <span>Biggest Fish</span>
            <span style="color: var(--accent-cyan)">PDF ❯</span>
        </div>
    </nav>

    <div id="viewer-modal">
        <div class="viewer-header">
            <span id="pdf-title" style="font-family: 'Oswald'; color: var(--accent-cyan);"></span>
            <div class="viewer-actions">
                <a id="download-link" href="#" download class="action-btn download-btn">Download ↓</a>
                <button class="action-btn close-btn" onclick="closePDF()">Close</button>
            </div>
        </div>
        <iframe id="pdf-frame" src=""></iframe>
    </div>

    <footer class="footer">
        SINGLE SOURCE OF TRUTH: <span class="version-tag">v7.7.0</span>
    </footer>

    <script>
        function openPDF(file, title) {
            const frame = document.getElementById('pdf-frame');
            const download = document.getElementById('download-link');
            
            // Add timestamp to bypass cache when you update the file
            const timestamp = new Date().getTime();
            const filePath = file + "?v=" + timestamp;
            
            frame.src = filePath;
            download.href = filePath;
            
            document.getElementById('pdf-title').innerText = title;
            document.getElementById('viewer-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closePDF() {
            document.getElementById('viewer-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
            document.getElementById('pdf-frame').src = "";
        }
    </script>
</body>
</html>
