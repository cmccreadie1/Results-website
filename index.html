<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishing Competition Results | v7.4.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0b0e;
            --surface-color: rgba(25, 28, 35, 0.75);
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background: radial-gradient(circle at center, #161b22 0%, #0a0b0e 100%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Movement Background */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.05;
            z-index: -1;
        }

        /* Dynamic Hub Header */
        .dynamic-hub {
            position: sticky;
            top: 20px;
            z-index: 100;
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        .hub-pill {
            background: var(--surface-color);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 10px 25px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(0, 242, 255, 0.1);
        }

        .hub-status {
            width: 10px;
            height: 10px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-cyan);
            animation: pulse 2s infinite;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Leaderboard Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 100px;
        }

        .leaderboard-card {
            background: var(--surface-color);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
            animation: slideUp 0.8s ease-out forwards;
        }

        .board-header {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            display: grid;
            grid-template-columns: 60px 1fr 100px 100px;
            font-weight: 700;
            color: var(--accent-cyan);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .entry-row {
            display: grid;
            grid-template-columns: 60px 1fr 100px 100px;
            padding: 20px;
            border-bottom: 1px solid var(--glass-border);
            align-items: center;
            transition: all 0.3s ease;
        }

        .entry-row:hover {
            background: rgba(0, 242, 255, 0.03);
            transform: scale(1.01);
        }

        .rank { font-family: 'Oswald', sans-serif; font-size: 1.5rem; opacity: 0.5; }
        .name { font-weight: 700; font-size: 1.1rem; }
        .weight { color: var(--accent-cyan); font-family: 'Oswald', sans-serif; }
        .date { font-size: 0.85rem; color: var(--text-dim); }

        /* SSoT Versioning Footer */
        .footer {
            text-align: center;
            padding: 40px;
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .version-tag {
            color: var(--accent-cyan);
            font-weight: 700;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .board-header { display: none; }
            .entry-row {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .rank { grid-column: span 2; border-bottom: 1px solid var(--glass-border); padding-bottom: 5px; }
            .weight { text-align: right; }
        }
    </style>
</head>
<body>

    <header class="dynamic-hub">
        <div class="hub-pill">
            <div class="hub-status"></div>
            <h1>John McCreadie Memorial</h1>
        </div>
    </header>

    <main class="container">
        <div class="leaderboard-card">
            <div class="board-header">
                <div>Rank</div>
                <div>Angler</div>
                <div>Weight</div>
                <div>Date</div>
            </div>
            
            <div id="results-list">
                <div class="entry-row">
                    <div class="rank">01</div>
                    <div class="name">Sample Angler</div>
                    <div class="weight">12lb 4oz</div>
                    <div class="date">Mar 22</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        SINGLE SOURCE OF TRUTH VERSION: <span class="version-tag">v7.4.0</span><br>
        &copy; 2026 Fishing Competition Results
    </footer>

    <script>
        // v7.4.0 Logic
        const VERSION = "7.4.0";
        
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW Registered v' + VERSION))
                    .catch(err => console.log('SW Failed', err));
            });
        }

        // Potential for data loading logic here without slimming current structure
    </script>
</body>
</html>
